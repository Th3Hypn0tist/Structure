name: Diagnose Canonical

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/diagnose_canonical.py"
      - "canonical_graph.py"
      - ".github/workflows/diagnose-canonical.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout StructureProjector
        uses: actions/checkout@v4

      - name: Checkout AIGMos docs
        uses: actions/checkout@v4
        with:
          repository: Th3Hypn0tist/AIGMos_docs
          ref: main
          path: _diagnostic_source

      - name: Run canonical graph diagnostic
        run: python3 tests/diagnose_canonical.py
