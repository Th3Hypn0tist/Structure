<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StructureProjector</title>
<style>
:root{--b:#020304;--w:#F8FAFF;--blue:#087CFF;--red:#FF176B;--silver:#AAB2C2;--yellow:#FFD83D;--neutral:#596170}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--w);font:14px/1.4 Inter,"Segoe UI",Arial,sans-serif;height:100vh;overflow:hidden}header{height:62px;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2px solid var(--blue)}header strong{font-size:18px}.muted{color:var(--silver);font-size:12px}.spacer{flex:1}button,select,input{background:var(--b);color:var(--w);border:1px solid var(--silver);border-radius:10px;padding:8px 10px}button{cursor:pointer}nav{height:48px;display:flex;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--silver)}nav button.active,.views button.active{border:2px solid var(--blue);color:var(--blue)}.shell{height:calc(100vh - 110px);display:grid;grid-template-columns:minmax(0,1fr) 360px}.main{position:relative;overflow:hidden}.bar{position:absolute;z-index:20;left:10px;top:10px;display:flex;gap:8px;flex-wrap:wrap}.views,.tools{display:flex;gap:6px;align-items:center;background:#020304ee;border:1px solid var(--silver);border-radius:12px;padding:8px}.viewport{position:absolute;inset:0;overflow:hidden}.hidden{display:none!important}.inspector{border-left:1px solid var(--silver);padding:16px;overflow:auto}.status{border:1px solid var(--silver);border-radius:999px;padding:3px 8px;font-size:12px;color:var(--silver)}.ok{color:var(--blue);border-color:var(--blue)}.bad{color:var(--red);border-color:var(--red)}svg{width:100%;height:100%;display:block;user-select:none}.focusable{cursor:pointer}.hit{fill:var(--b);stroke:var(--neutral);stroke-width:1.5}.s-unlocked{stroke:var(--yellow)!important}.s-locked{stroke:var(--blue)!important}.s-validated{stroke:var(--silver)!important}.s-special{stroke:var(--red)!important}.focusable:hover>.hit,.focusable.active>.hit{stroke-width:3}.title{fill:var(--w);font-weight:900}.sub{fill:var(--silver)}.chiptext{fill:var(--w);font-size:12px;font-weight:750}.small{fill:var(--silver);font-size:10px}.count{fill:var(--blue);font-size:10px;font-weight:800}.edge{stroke:var(--neutral);stroke-width:1;fill:none;opacity:.55}.crumb{color:var(--silver);font-size:11px;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kv{margin-bottom:12px}.kv b{color:var(--blue)}.badge{display:inline-block;border:1px solid var(--neutral);border-radius:999px;padding:2px 7px;font-size:10px}.badge.unlocked{border-color:var(--yellow);color:var(--yellow)}.badge.locked{border-color:var(--blue);color:var(--blue)}.badge.validated{border-color:var(--silver);color:var(--silver)}.badge.special{border-color:var(--red);color:var(--red)}pre{white-space:pre-wrap;word-break:break-word;border:1px solid var(--silver);border-radius:10px;padding:10px;font:11px/1.4 ui-monospace,monospace}#depth{width:72px;padding:6px 8px}
</style></head><body>
<header><strong>StructureProjector</strong><span id="status" class="status">idle</span><span id="repo" class="muted"></span><div class="spacer"></div><label>Branch <select id="branch"></select></label><button id="reload">Reload</button><span id="rev" class="muted"></span></header>
<nav id="nav"></nav>
<div class="shell"><section class="main"><div class="bar"><div class="views" id="views"></div><div class="tools"><label id="fileWrap" class="hidden">JSON <select id="jsonFile"></select></label><label>Depth <select id="depth"><option>0</option><option selected>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label><button id="up" disabled>Up</button><button id="fit">Fit</button><span id="crumb" class="crumb">root</span><span id="zoom" class="muted">100%</span></div></div><div id="svgView" class="viewport"><svg id="canvas"><g id="world"></g></svg></div></section><aside id="inspector" class="inspector"><h2>Inspector</h2><div class="muted">Select an item.</div></aside></div>
<script>
const S={cms:null,page:null,view:null,data:null,focus:null,history:[],cameras:new Map(),local:null};const $=q=>document.querySelector(q);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function gj(u){const r=await fetch(u),d=await r.json();if(!r.ok)throw d;return d}function st(t,b=false){$('#status').textContent=t;$('#status').className='status '+(b?'bad':'ok')}function statusClass(s){s=String(s||'').toLowerCase();if(s==='unlocked')return's-unlocked';if(s==='locked')return's-locked';if(s==='validated')return's-validated';if(['superseded','deprecated','rejected','invalid','failed','conflict','error'].includes(s))return's-special';return''}function badge(s){if(!s)return'';const c=statusClass(s).replace('s-','');return`<span class="badge ${c}">${esc(s)}</span>`}
function cam(){if(!S.cameras.has(S.view))S.cameras.set(S.view,{x:0,y:0,z:1,bw:1000,bh:700});return S.cameras.get(S.view)}function applyCam(){const c=cam(),r=$('#svgView').getBoundingClientRect();c.bw=r.width||1000;c.bh=r.height||700;$('#canvas').setAttribute('viewBox',`${c.x} ${c.y} ${c.bw/c.z} ${c.bh/c.z}`);$('#zoom').textContent=Math.round(c.z*100)+'%'}function fitBox(box,pad=.94){const r=$('#svgView').getBoundingClientRect(),c=cam(),w=Math.max(1,box.width),h=Math.max(1,box.height),z=Math.max(.03,Math.min(20,Math.min(r.width/w,r.height/h)*pad));c.bw=r.width;c.bh=r.height;c.z=z;c.x=box.x-(r.width/z-w)/2;c.y=box.y-(r.height/z-h)/2;applyCam()}function wheel(e){e.preventDefault();const r=$('#canvas').getBoundingClientRect(),c=cam(),bw=r.width/c.z,bh=r.height/c.z,mx=(e.clientX-r.left)/r.width,my=(e.clientY-r.top)/r.height,wx=c.x+mx*bw,wy=c.y+my*bh,nz=Math.min(20,Math.max(.03,c.z*Math.exp(-e.deltaY*.0015))),aw=r.width/nz,ah=r.height/nz;c.z=nz;c.x=wx-mx*aw;c.y=wy-my*ah;applyCam()}let drag=null;function pd(e){if(e.button||e.target.closest('.focusable'))return;const c=cam();drag={sx:e.clientX,sy:e.clientY,x:c.x,y:c.y}}function pm(e){if(!drag)return;const c=cam();c.x=drag.x-(e.clientX-drag.sx)/c.z;c.y=drag.y-(e.clientY-drag.sy)/c.z;applyCam()}function pu(){drag=null}
async function init(){S.cms=await gj('/api/nanocms');S.page=S.cms.default_page;renderNav();await resolvePage();const b=await gj('/api/branches');$('#repo').textContent=b.repository;$('#branch').innerHTML=b.branches.map(x=>`<option>${esc(x.name)}</option>`).join('');if(b.branches.some(x=>x.name==='main'))$('#branch').value='main';await load()}function renderNav(){$('#nav').innerHTML=S.cms.navigation.map(x=>`<button data-page="${x.id}" class="${x.id===S.page?'active':''}">${esc(x.menuitem)}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=async()=>{S.page=b.dataset.page;resetFocus();renderNav();await resolvePage();await load()})}async function resolvePage(){const p=await gj('/api/nanocms?page='+encodeURIComponent(S.page));S.cms=p;S.view=p.selected_page.placements[0].id;renderViews(p.selected_page.placements)}function renderViews(ps){$('#views').innerHTML=ps.map(p=>`<button data-view="${p.id}" class="${p.id===S.view?'active':''}">${esc(p.title)}</button>`).join('');$('#views').querySelectorAll('button').forEach(b=>b.onclick=async()=>{S.view=b.dataset.view;resetFocus();renderViews(ps);await load()})}function resetFocus(){S.focus=null;S.local=null;S.history=[];$('#up').disabled=true;$('#crumb').textContent='root'}function projectUrl(){const q=new URLSearchParams({branch:$('#branch').value,page:S.page,view:S.view});if(S.page==='raw-json'&&$('#jsonFile').value)q.set('path',$('#jsonFile').value);return'/api/project?'+q}
async function load(){st('loading');try{S.data=await gj(projectUrl());$('#rev').textContent=S.data.source.revision.slice(0,12);if(S.data.ruleset==='RawJSON'){const fs=S.data.source.available_json_files||[];$('#fileWrap').classList.remove('hidden');$('#jsonFile').innerHTML=fs.map(p=>`<option value="${esc(p)}" ${p===S.data.source.path?'selected':''}>${esc(p)}</option>`).join('')}else $('#fileWrap').classList.add('hidden');st(`${S.data.page.title} · ${S.data.placement.title}`);render();inspect(null)}catch(e){st('invalid',true);$('#world').innerHTML='';$('#inspector').innerHTML=`<h2>Error</h2><pre>${esc(JSON.stringify(e,null,2))}</pre>`}}
function render(){if(S.data?.placement?.renderer==='svg_view_rules')renderExplicit();else renderGraph()}function draw(x){const sc=statusClass(x.status),count=x.child_count?`<text class="count" x="${x.x+x.width-10}" y="${x.y+18}" text-anchor="end">${x.child_count}</text>`:'';return`<g class="focusable" data-id="${esc(x.id)}"><rect class="hit ${sc}" x="${x.x}" y="${x.y}" width="${x.width}" height="${x.height}" rx="${x.kind==='section'?18:9}"/><text class="${x.kind==='section'?'title':'chiptext'}" x="${x.x+10}" y="${x.y+22}">${esc((x.title||'').slice(0,55))}</text>${x.height>48?`<text class="small" x="${x.x+10}" y="${x.y+42}">${esc((x.summary||'').slice(0,110))}</text>`:''}${count}</g>`}
function renderExplicit(){if(S.local){renderLocal();return}const g=S.data.geometry;if(!g)return;$('#world').innerHTML=g.occurrences.map(draw).join('');bind();if(!S.cameras.has(S.view))fitBox({x:0,y:0,width:g.view_box.width,height:g.view_box.height});else applyCam()}function bind(){$('#world').querySelectorAll('.focusable').forEach(el=>el.onclick=async e=>{e.stopPropagation();const arr=S.local?.occurrences||S.data.geometry?.occurrences||[];const x=arr.find(o=>o.id===el.dataset.id);if(x)await openOccurrence(x)})}
async function openOccurrence(x){S.history.push({focus:S.focus,local:S.local,camera:{...cam()}});S.focus=x.id;inspect(x);if(x.provenance?.source_path){await loadBindingFocus(x);return}const direct=(S.data.geometry?.occurrences||[]).filter(o=>o.parent_id===x.id);S.local=layoutFlat(x,direct);renderLocal();$('#up').disabled=false}
async function loadBindingFocus(x){const q=new URLSearchParams({branch:$('#branch').value,source_path:x.provenance.source_path,pointer:x.provenance.pointer||'/',depth:$('#depth').value});const d=await gj('/api/binding-tree?'+q);S.local=layoutTree(x,d);renderLocal();inspect({...x,requested_depth:d.requested_depth,effective_depth:d.effective_depth,truncated:d.truncated,child_count:d.child_count});$('#up').disabled=false}
function layoutTree(parent,d){const W=1600,pad=36,header=82,gapX=14,gapY=96;const nodes=[{id:'local-root',kind:'section',title:parent.title,status:parent.status,summary:parent.summary,provenance:parent.provenance,child_count:d.child_count,x:pad,y:pad,width:W-pad*2,height:58,depth:0,parent_id:null}];const levels=new Map();for(const n of d.nodes){if(n.depth===0)continue;if(!levels.has(n.depth))levels.set(n.depth,[]);levels.get(n.depth).push(n)}let y=pad+header;for(const depth of [...levels.keys()].sort((a,b)=>a-b)){const items=levels.get(depth),cols=Math.max(1,Math.min(5,Math.ceil(Math.sqrt(items.length)))),inner=W-pad*2,itemW=(inner-(cols-1)*gapX)/cols,itemH=76,rows=Math.ceil(items.length/cols);items.forEach((n,i)=>{const row=Math.floor(i/cols),col=i%cols;nodes.push({id:n.id,kind:'item',title:n.title,summary:n.summary,status:n.status,child_count:n.child_count,provenance:n.provenance,parent_binding_id:n.parent_id,depth:n.depth,parent_id:'local-root',x:pad+col*(itemW+gapX),y:y+row*(itemH+gapX),width:itemW,height:itemH})});y+=rows*(itemH+gapX)+gapY}return{view_box:{width:W,height:Math.max(520,y+pad)},occurrences:nodes,parent,meta:d}}
function layoutFlat(parent,children){const W=1600,pad=36,gap=14,cols=Math.max(1,Math.min(4,Math.ceil(Math.sqrt(Math.max(1,children.length))))),itemW=(W-pad*2-(cols-1)*gap)/cols,itemH=82,rows=Math.ceil(children.length/cols),H=Math.max(520,110+rows*(itemH+gap)+pad),occ=[{...parent,id:'local-root',kind:'section',parent_id:null,x:pad,y:pad,width:W-pad*2,height:58,child_count:children.length}];children.forEach((c,i)=>{const row=Math.floor(i/cols),col=i%cols;occ.push({...c,id:'local-'+i,parent_id:'local-root',x:pad+col*(itemW+gap),y:110+row*(itemH+gap),width:itemW,height:itemH})});return{view_box:{width:W,height:H},occurrences:occ,parent}}
function renderLocal(){const g=S.local;let edges='';if(g.meta){const pos=new Map(g.occurrences.map(x=>[x.provenance?.pointer||x.id,x]));for(const n of g.meta.nodes||[]){if(n.depth===0||!n.parent_id)continue;const a=pos.get(n.parent_id),b=pos.get(n.provenance?.pointer);if(a&&b)edges+=`<path class="edge" d="M${a.x+a.width/2},${a.y+a.height} L${b.x+b.width/2},${b.y}"/>`}}$('#world').innerHTML=edges+g.occurrences.map(draw).join('');bind();fitBox({x:0,y:0,width:g.view_box.width,height:g.view_box.height});$('#crumb').textContent=crumbText()}function crumbText(){const xs=[];for(const h of S.history){if(h.local?.parent?.title)xs.push(h.local.parent.title)}if(S.local?.parent?.title)xs.push(S.local.parent.title);return xs.length?xs.join(' / '):'root'}function up(){if(!S.history.length)return;const h=S.history.pop();S.focus=h.focus;S.local=h.local;S.cameras.set(S.view,{...h.camera});if(S.local)renderLocal();else renderExplicit();applyCam();$('#up').disabled=!S.history.length;$('#crumb').textContent=crumbText();inspect(S.local?.parent||null)}
function inspect(x){if(!x){$('#inspector').innerHTML='<h2>Inspector</h2><div class="muted">Select an item.</div>';return}const p=x.provenance||{};$('#inspector').innerHTML=`<h2>${esc(x.title||x.id)}</h2><div class="kv">${badge(x.status)}</div>${x.summary?`<div class="kv"><b>Summary</b><br>${esc(x.summary)}</div>`:''}${p.source_path?`<div class="kv"><b>Source</b><br>${esc(p.source_path)}</div><div class="kv"><b>JSON Pointer</b><br>${esc(p.pointer||'/')}</div>`:''}<div class="kv"><b>Children</b><br>${x.child_count||0}</div>${x.requested_depth!==undefined?`<div class="kv"><b>Depth</b><br>${x.effective_depth} / requested ${x.requested_depth}</div>`:''}${x.truncated?`<div class="kv"><b>Traversal</b><br>TRUNCATED BY NODE BUDGET</div>`:''}`}
function renderGraph(){const ns=S.data.graph?.nodes||[],w=1200,h=Math.max(650,80+ns.length*58);$('#world').innerHTML=ns.map((n,i)=>`<g class="focusable"><rect class="hit ${statusClass(n.status)}" x="70" y="${70+i*55}" width="500" height="42" rx="9"/><text class="chiptext" x="82" y="${96+i*55}">${esc(n.name||n.id)}</text></g>`).join('');if(!S.cameras.has(S.view))fitBox({x:0,y:0,width:w,height:h});else applyCam()}
$('#canvas').addEventListener('wheel',wheel,{passive:false});$('#svgView').addEventListener('pointerdown',pd);window.addEventListener('pointermove',pm);window.addEventListener('pointerup',pu);$('#up').onclick=up;$('#fit').onclick=()=>{if(S.local)fitBox({x:0,y:0,width:S.local.view_box.width,height:S.local.view_box.height});else if(S.data?.geometry)fitBox({x:0,y:0,width:S.data.geometry.view_box.width,height:S.data.geometry.view_box.height})};$('#reload').onclick=()=>load();$('#branch').onchange=()=>{resetFocus();S.cameras.clear();load()};$('#jsonFile').onchange=()=>{resetFocus();load()};$('#depth').onchange=async()=>{if(S.local?.parent?.provenance?.source_path)await loadBindingFocus(S.local.parent)};init();
</script></body></html>
