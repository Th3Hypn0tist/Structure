<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Structure</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <canvas id="scene"></canvas>
  <header id="toolbar">
    <strong>Structure</strong>
    <button id="add">+ Entity</button>
    <button id="delete">Delete</button>
    <button id="save">Save</button>
    <button id="load">Load</button>
    <button id="settingsButton">Settings</button>
    <span id="status">ready</span>
  </header>
  <aside id="inspector">
    <h3>Inspector</h3>
    <div id="selection">No selection</div>
  </aside>
  <aside id="settings" hidden>
    <h3>Camera Defaults</h3>
    <label>FOV <input id="fov" type="range" min="15" max="170" value="60"><output id="fovValue">60°</output></label>
    <label>Move speed <input id="moveSpeed" type="number" min="0.1" step="0.1" value="6"></label>
    <label>Mouse sensitivity <input id="mouseSensitivity" type="number" min="0.0001" step="0.0001" value="0.0025"></label>
    <button id="setCameraDefault">Set current camera as default</button>
    <button id="resetCamera">Reset to default camera</button>
    <hr>
    <h3>Event Playback / Causal Visualization</h3>
    <label>Base link speed <input id="baseLinkSpeed" type="number" step="0.05" value="0.15"></label>
    <label>Active link speed <input id="activeLinkSpeed" type="number" step="0.1" value="2"></label>
    <label>Effect travel (s) <input id="effectTravel" type="number" step="0.1" value="1.2"></label>
  </aside>
  <div id="help">RMB drag: look · WASD/QE: move · LMB: select · drag XYZ gizmo: move node</div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
