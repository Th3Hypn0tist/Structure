<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StructureProjector Scene Viewer</title>
<style>
:root{--bg:#020304;--fg:#f8faff;--muted:#aab2c2;--blue:#087cff;--red:#ff176b;--gold:#ffd83d;--panel:#080b10;--line:#394252}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:14px/1.35 Inter,"Segoe UI",Arial,sans-serif}button,select,input{font:inherit}button,select{background:#05070a;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 9px}button{cursor:pointer}button:hover{border-color:var(--blue)}
header{height:58px;display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);background:#030507}header strong{font-size:18px}.spacer{flex:1}.muted{color:var(--muted);font-size:12px}.status{border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:11px}.status.ok{color:var(--blue);border-color:var(--blue)}.status.bad{color:var(--red);border-color:var(--red)}
.shell{height:calc(100vh - 58px);display:grid;grid-template-columns:300px minmax(0,1fr) 330px}.left,.right{background:var(--panel);overflow:auto}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.panel{padding:13px;border-bottom:1px solid var(--line)}.panel h2{font-size:14px;margin:0 0 10px}.panel h3{font-size:12px;margin:12px 0 7px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.viewer{position:relative;overflow:hidden;background:radial-gradient(circle at center,#07101c 0,#020304 58%)}#space{position:absolute;inset:0;perspective:1200px;overflow:hidden}#world{position:absolute;left:50%;top:50%;transform-style:preserve-3d}.toolbar{position:absolute;z-index:20;top:10px;left:10px;display:flex;gap:6px;background:#020304dd;border:1px solid var(--line);border-radius:10px;padding:6px}
.projection-row,.channel-row{display:grid;align-items:center;gap:8px;margin:7px 0}.projection-row{grid-template-columns:20px 1fr}.channel-row{grid-template-columns:20px 1fr 34px}.channel-row label,.projection-row label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.channel-row input[type=checkbox],.projection-row input[type=checkbox]{accent-color:var(--blue)}.swatch{width:32px;height:25px;padding:0;border:1px solid #ffffff66;border-radius:7px}.color-picker{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.scene-object{position:absolute;transform-style:preserve-3d}.object-title{position:absolute;left:0;top:-36px;transform:translateX(-50%);padding:4px 8px;border:1px solid var(--line);border-radius:7px;background:#020304e8;color:var(--muted);font-size:11px;white-space:nowrap;pointer-events:none}.scene-node{position:absolute;transform-style:preserve-3d;cursor:pointer}.scene-node.selected .face{border-width:2px;border-color:#fff}.node-label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translateZ(31px);width:126px;text-align:center;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;text-shadow:0 1px 2px #000}
.primitive-box{width:140px;height:54px;margin-left:-70px;margin-top:-27px}.face{position:absolute;border:1px solid #596273;background:#080b10dd;backface-visibility:hidden}.front,.back{width:140px;height:54px}.front{transform:translateZ(28px)}.back{transform:rotateY(180deg) translateZ(28px)}.left-face,.right-face{width:56px;height:54px;left:42px}.left-face{transform:rotateY(-90deg) translateZ(70px)}.right-face{transform:rotateY(90deg) translateZ(70px)}.top-face,.bottom-face{width:140px;height:56px;top:-1px}.top-face{transform:rotateX(90deg) translateZ(28px)}.bottom-face{transform:rotateX(-90deg) translateZ(26px)}
.scene-connection{position:absolute;height:2px;transform-origin:0 50%;pointer-events:none;opacity:.72;border-radius:999px}.scene-connection.cross_projection{height:3px;opacity:.9}.scene-connection::after{content:"";position:absolute;right:-2px;top:-3px;border-left:7px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent}.empty{color:var(--muted);font-size:12px}.kv{margin:0 0 10px}.kv b{display:block;color:var(--blue);font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}.legend{display:inline-flex;gap:5px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.warn{color:var(--gold)}pre{white-space:pre-wrap;word-break:break-word;border:1px solid var(--line);border-radius:8px;padding:8px;font:10px/1.35 ui-monospace,monospace}
</style>
</head>
<body>
<header><strong>StructureProjector</strong><span id="status" class="status">idle</span><span class="muted">Scene Viewer v1</span><div class="spacer"></div><label>Branch <select id="branch"></select></label><button id="reload">Reload</button><span id="revision" class="muted"></span></header>
<div class="shell">
  <aside class="left">
    <section class="panel"><h2>Projections</h2><div id="projections" class="empty">Loading…</div></section>
    <section class="panel"><h2>Connections</h2><div id="channels" class="empty">Load a Scene.</div></section>
    <section class="panel"><h2>Composition</h2><div id="composition" class="empty">No Scene loaded.</div></section>
  </aside>
  <main class="viewer">
    <div class="toolbar"><button id="fit">Fit</button><button id="resetCamera">Reset camera</button><span id="zoom" class="muted">100%</span></div>
    <div id="space"><div id="world"></div></div>
  </main>
  <aside class="right"><section class="panel" id="inspector"><h2>Inspector</h2><div class="empty">Select a node.</div></section></aside>
</div>
<script>
const $=q=>document.querySelector(q);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={cms:null,scene:null,source:null,selected:null,views:new Set(),channelState:{},rotX:-18,rotY:26,zoom:1,drag:null};
function status(text,bad=false){$('#status').textContent=text;$('#status').className='status '+(bad?'bad':'ok')}
async function gj(url){const r=await fetch(url),d=await r.json();if(!r.ok)throw d;return d}
function labelForChannel(id){return({relations:'Semantic',semantic:'Semantic',dependencies:'Dependency',dependency:'Dependency',containment:'Structural',structural:'Structural',tree:'Tree',ownership:'Ownership',authority:'Authority',binding:'Binding'})[id]||id}
function sceneUrl(){const q=new URLSearchParams({branch:$('#branch').value,page:'canonical',views:[...S.views].join(',')});return'/api/scene?'+q}
async function init(){try{status('loading');const [cms,branches]=await Promise.all([gj('/api/nanocms?page=canonical'),gj('/api/branches')]);S.cms=cms;$('#branch').innerHTML=branches.branches.map(b=>`<option value="${esc(b.name)}">${esc(b.name)}</option>`).join('');if(branches.branches.some(b=>b.name==='main'))$('#branch').value='main';const placements=cms.selected_page.placements||[];for(const p of placements.slice(0,2))S.views.add(p.id);renderProjectionControls();await loadScene()}catch(e){showError(e)}}
function renderProjectionControls(){const ps=S.cms?.selected_page?.placements||[];$('#projections').innerHTML=ps.map(p=>`<div class="projection-row"><input type="checkbox" data-view="${esc(p.id)}" ${S.views.has(p.id)?'checked':''}><label title="${esc(p.title)}">${esc(p.title)}</label></div>`).join('')||'<div class="empty">No projections.</div>';$('#projections').querySelectorAll('input').forEach(el=>el.onchange=async()=>{if(el.checked)S.views.add(el.dataset.view);else S.views.delete(el.dataset.view);if(!S.views.size){el.checked=true;S.views.add(el.dataset.view);return}await loadScene()})}
async function loadScene(){status('loading');S.selected=null;try{const data=await gj(sceneUrl());S.source=data.source||{};S.scene=data.scene;$('#revision').textContent=(S.source.revision||'').slice(0,12);syncChannels();renderChannels();renderComposition();renderScene();inspect(null);status(`${S.scene?.objects?.length||0} projections`)}catch(e){showError(e)}}
function syncChannels(){for(const [id,cfg] of Object.entries(S.scene?.connection_channels||{})){if(!S.channelState[id])S.channelState[id]={enabled:cfg.enabled!==false,color:cfg.color||'#AAB2C2'}}}
function renderChannels(){const used=new Set((S.scene?.connections||[]).map(c=>String(c.channel||'semantic')));const ids=Object.keys(S.scene?.connection_channels||{}).filter(id=>used.has(id));$('#channels').innerHTML=ids.map(id=>{const st=S.channelState[id];return`<div class="channel-row"><input type="checkbox" data-enable="${esc(id)}" ${st.enabled?'checked':''}><label>${esc(labelForChannel(id))}</label><button class="swatch" data-color="${esc(id)}" style="background:${esc(st.color)}" title="Choose ${esc(labelForChannel(id))} color"></button><input class="color-picker" type="color" data-picker="${esc(id)}" value="${esc(st.color)}"></div>`}).join('')||'<div class="empty">No connection channels in this Scene.</div>';$('#channels').querySelectorAll('[data-enable]').forEach(el=>el.onchange=()=>{S.channelState[el.dataset.enable].enabled=el.checked;renderScene()});$('#channels').querySelectorAll('[data-color]').forEach(btn=>btn.onclick=()=>{$(`[data-picker="${CSS.escape(btn.dataset.color)}"]`).click()});$('#channels').querySelectorAll('[data-picker]').forEach(p=>p.oninput=()=>{const id=p.dataset.picker;S.channelState[id].color=p.value;$(`[data-color="${CSS.escape(id)}"]`).style.background=p.value;renderScene()})}
function renderComposition(){const c=S.scene?.composition||{};const used=[...new Set((S.scene?.connections||[]).map(x=>x.channel))];$('#composition').innerHTML=`<div class="kv"><b>Projection objects</b>${c.projection_count??S.scene?.objects?.length??0}</div><div class="kv"><b>Internal connections</b>${c.internal_connections??0}</div><div class="kv"><b>Cross-projection</b>${c.cross_projection_connections??0}</div><div class="kv"><b>Active channels</b>${used.map(id=>`<span class="legend"><span class="dot" style="background:${esc(S.channelState[id]?.color||'#AAB2C2')}"></span>${esc(labelForChannel(id))}</span>`).join('<br>')}</div>`}
function transformPoint(p,t){let x=(p.x||0)*(t?.scale?.x??1),y=(p.y||0)*(t?.scale?.y??1),z=(p.z||0)*(t?.scale?.z??1);const rx=(t?.rotation?.x||0)*Math.PI/180,ry=(t?.rotation?.y||0)*Math.PI/180,rz=(t?.rotation?.z||0)*Math.PI/180;let y1=y*Math.cos(rx)-z*Math.sin(rx),z1=y*Math.sin(rx)+z*Math.cos(rx);y=y1;z=z1;let x1=x*Math.cos(ry)+z*Math.sin(ry);z1=-x*Math.sin(ry)+z*Math.cos(ry);x=x1;z=z1;x1=x*Math.cos(rz)-y*Math.sin(rz);y1=x*Math.sin(rz)+y*Math.cos(rz);x=x1;y=y1;return{x:x+(t?.position?.x||0),y:y+(t?.position?.y||0),z:z+(t?.position?.z||0)}}
function nodeWorld(obj,node){return transformPoint(node.transform?.position||{},obj.transform||{})}
function boxFaces(){return'<div class="face front"></div><div class="face back"></div><div class="face left-face"></div><div class="face right-face"></div><div class="face top-face"></div><div class="face bottom-face"></div>'}
function nodeHtml(obj,node){const p=node.transform?.position||{},name=node.properties?.name||node.id,primitive=node.primitive||'box',selected=S.selected?.object===obj.id&&S.selected?.node===node.id?' selected':'';const body=primitive==='box'?boxFaces():boxFaces();return`<div class="scene-node primitive-box${selected}" data-object="${esc(obj.id)}" data-node="${esc(node.id)}" style="transform:translate3d(${p.x||0}px,${p.y||0}px,${p.z||0}px)">${body}<div class="node-label">${esc(name)}</div></div>`}
function connectionHtml(conn,index,positions){const channel=String(conn.channel||'semantic'),state=S.channelState[channel]||{enabled:true,color:'#AAB2C2'};if(!state.enabled)return'';const a=positions.get(`${conn.from?.object}::${conn.from?.node}`),b=positions.get(`${conn.to?.object}::${conn.to?.node}`);if(!a||!b)return'';const lane=(index%7-3)*4,ax=a.x,ay=a.y,az=a.z+lane,bx=b.x,by=b.y,bz=b.z+lane,dx=bx-ax,dy=by-ay,dz=bz-az,len=Math.sqrt(dx*dx+dy*dy+dz*dz);if(!len)return'';const yaw=Math.atan2(dz,dx)*180/Math.PI,pitch=-Math.atan2(dy,Math.sqrt(dx*dx+dz*dz))*180/Math.PI;const color=state.color;return`<div class="scene-connection ${esc(conn.scope||'')}" title="${esc(labelForChannel(channel))}: ${esc(conn.type||'')}" style="color:${esc(color)};background:${esc(color)};box-shadow:0 0 8px ${esc(color)};width:${len}px;transform:translate3d(${ax}px,${ay}px,${az}px) rotateY(${-yaw}deg) rotateZ(${pitch}deg)"></div>`}
function renderScene(){const scene=S.scene;if(!scene)return;const positions=new Map();let html='';for(const obj of scene.objects||[]){const t=obj.transform||{},p=t.position||{},r=t.rotation||{},s=t.scale||{};html+=`<div class="scene-object" data-object="${esc(obj.id)}" style="transform:translate3d(${p.x||0}px,${p.y||0}px,${p.z||0}px) rotateX(${r.x||0}deg) rotateY(${r.y||0}deg) rotateZ(${r.z||0}deg) scale3d(${s.x??1},${s.y??1},${s.z??1})"><div class="object-title">${esc(obj.title||obj.projection_id||obj.id)}</div>`;for(const node of obj.nodes||[]){positions.set(`${obj.id}::${node.id}`,nodeWorld(obj,node));html+=nodeHtml(obj,node)}html+='</div>'}const lines=(scene.connections||[]).map((c,i)=>connectionHtml(c,i,positions)).join('');$('#world').innerHTML=lines+html;$('#world').querySelectorAll('.scene-node').forEach(el=>el.onclick=e=>{e.stopPropagation();S.selected={object:el.dataset.object,node:el.dataset.node};const obj=(scene.objects||[]).find(o=>o.id===S.selected.object),node=(obj?.nodes||[]).find(n=>String(n.id)===S.selected.node);inspect(node,obj);renderScene()});applyCamera()}
function inspect(node,obj){if(!node||!obj){$('#inspector').innerHTML='<h2>Inspector</h2><div class="empty">Select a node.</div>';return}const conns=(S.scene.connections||[]).filter(c=>(c.from?.object===obj.id&&String(c.from?.node)===String(node.id))||(c.to?.object===obj.id&&String(c.to?.node)===String(node.id)));$('#inspector').innerHTML=`<h2>${esc(node.properties?.name||node.id)}</h2><div class="kv"><b>SceneObject</b>${esc(obj.id)}</div><div class="kv"><b>Projection</b>${esc(obj.projection_id||'')}</div><div class="kv"><b>Node</b>${esc(node.id)}</div><div class="kv"><b>Source ref</b>${esc(node.source_ref||'')}</div><div class="kv"><b>Primitive</b>${esc(node.primitive||'')}</div><div class="kv"><b>Type</b>${esc(node.properties?.type||'')}</div><div class="kv"><b>Status</b>${esc(node.properties?.status||'')}</div><div class="kv"><b>Connections</b>${conns.length}</div><pre>${esc(JSON.stringify(node,null,2))}</pre>`}
function applyCamera(){const z=S.zoom;$('#world').style.transform=`rotateX(${S.rotX}deg) rotateY(${S.rotY}deg) scale(${z})`;$('#zoom').textContent=Math.round(z*100)+'%'}
function fit(){const objects=S.scene?.objects||[];if(!objects.length)return;let max=900;for(const o of objects){const p=o.transform?.position||{};max=Math.max(max,Math.abs(p.x||0)+900,Math.abs(p.y||0)+900,Math.abs(p.z||0)+900,o.extent||0)}S.zoom=Math.max(.05,Math.min(1.5,900/(max*1.4)));applyCamera()}
function resetCamera(){S.rotX=-18;S.rotY=26;S.zoom=1;applyCamera()}
function showError(e){status('error',true);const x=e?.errors||e;$('#composition').innerHTML=`<pre>${esc(JSON.stringify(x,null,2))}</pre>`}
$('#reload').onclick=loadScene;$('#branch').onchange=loadScene;$('#fit').onclick=fit;$('#resetCamera').onclick=resetCamera;
$('#space').onwheel=e=>{e.preventDefault();S.zoom=Math.max(.03,Math.min(4,S.zoom*Math.exp(-e.deltaY*.001)));applyCamera()};
$('#space').onpointerdown=e=>{if(e.button!==0||e.target.closest('.scene-node'))return;S.drag={x:e.clientX,y:e.clientY,rx:S.rotX,ry:S.rotY};$('#space').setPointerCapture(e.pointerId)};
$('#space').onpointermove=e=>{if(!S.drag)return;S.rotY=S.drag.ry+(e.clientX-S.drag.x)*.25;S.rotX=Math.max(-89,Math.min(89,S.drag.rx-(e.clientY-S.drag.y)*.25));applyCamera()};
$('#space').onpointerup=e=>{S.drag=null;try{$('#space').releasePointerCapture(e.pointerId)}catch{}};
init();
</script>
</body>
</html>
