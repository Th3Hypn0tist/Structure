<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StructureProjector</title>
<style>
:root{--b:#020304;--w:#F8FAFF;--bl:#087CFF;--r:#FF176B;--s:#AAB2C2}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--w);font:14px/1.4 Inter,"Segoe UI",Arial,sans-serif;height:100vh;overflow:hidden}header{height:62px;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2px solid var(--bl)}header strong{font-size:18px}.muted{color:var(--s);font-size:12px}.spacer{flex:1}button,select{background:var(--b);color:var(--w);border:1px solid var(--s);border-radius:10px;padding:8px 10px}button{cursor:pointer}nav{height:48px;display:flex;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--s)}nav button.active,.views button.active{border:2px solid var(--bl);color:var(--bl)}.shell{height:calc(100vh - 110px);display:grid;grid-template-columns:minmax(0,1fr) 380px}.main{position:relative;overflow:hidden}.bar{position:absolute;z-index:10;left:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap}.views,.tools{display:flex;gap:6px;align-items:center;background:#020304ee;border:1px solid var(--s);border-radius:12px;padding:8px}.viewport{position:absolute;inset:0;overflow:hidden}.hidden{display:none!important}.inspector{border-left:1px solid var(--s);padding:16px;overflow:auto}.status{border:1px solid var(--s);border-radius:999px;padding:3px 8px;font-size:12px;color:var(--s)}.ok{color:var(--bl);border-color:var(--bl)}.bad{color:var(--r);border-color:var(--r)}pre{white-space:pre-wrap;word-break:break-word;border:1px solid var(--s);border-radius:10px;padding:10px;font:11px/1.4 ui-monospace,monospace}.error{border:2px solid var(--r);border-radius:12px;padding:12px}.error strong{color:var(--r)}svg{width:100%;height:100%;display:block;user-select:none}.node{cursor:pointer}.node rect{fill:var(--b);stroke:var(--s);stroke-width:2}.node.selected rect,.node:hover rect{stroke:var(--bl);stroke-width:3}.node text{pointer-events:none}.name{fill:var(--w);font-size:13px;font-weight:800}.type{fill:var(--s);font-size:10px}.edge{fill:none;stroke:var(--s);stroke-width:1.5;opacity:.7}.map-frame{fill:var(--b);stroke:var(--bl);stroke-width:2.5}.map-section{fill:var(--b);stroke:var(--s);stroke-width:2}.map-card{fill:var(--b);stroke:var(--s);stroke-width:1.8}.map-chip{fill:var(--b);stroke:var(--s);stroke-width:1.2}.map-title{fill:var(--w);font-size:18px;font-weight:900}.map-sub{fill:var(--s);font-size:11px}.map-key{fill:var(--bl);font-size:10px;font-weight:800}.map-value{fill:var(--w);font-size:10px}#space3d{perspective:900px}#scene3d{position:absolute;left:50%;top:50%;transform-style:preserve-3d}.n3{position:absolute;width:160px;height:54px;margin:-27px 0 0 -80px;border:2px solid var(--s);border-radius:12px;background:var(--b);padding:7px 9px;cursor:pointer}.n3.selected,.n3:hover{border-color:var(--bl)}.n3 small{color:var(--s)}.zoomread{min-width:46px;color:var(--s);font-size:11px;text-align:right}
</style></head><body>
<header><strong>StructureProjector</strong><span id="status" class="status">idle</span><span id="repo" class="muted"></span><div class="spacer"></div><label>Branch <select id="branch"></select></label><button id="reload">Reload</button><span id="rev" class="muted"></span></header>
<nav id="nav"></nav>
<div class="shell"><section class="main"><div class="bar"><div class="views" id="views"></div><div class="tools"><label id="fileWrap" class="hidden">JSON <select id="jsonFile"></select></label><span id="dims"><label><input type="checkbox" data-dim="containment" checked>containment</label> <label><input type="checkbox" data-dim="relations" checked>relations</label> <label><input type="checkbox" data-dim="ownership" checked>ownership</label> <label><input type="checkbox" data-dim="authority" checked>authority</label> <label><input type="checkbox" data-dim="dependencies" checked>dependencies</label></span><button id="fit">Fit</button><span id="zoomread" class="zoomread">100%</span></div></div><div id="svgView" class="viewport"><svg id="canvas"><g id="world"></g></svg></div><div id="space3d" class="viewport hidden"><div id="scene3d"></div></div></section><aside id="inspector" class="inspector"><h2>Inspector</h2><div class="muted">Select a node.</div></aside></div>
<script>
const S={cms:null,page:null,view:null,data:null,selected:null,visible:new Set(['containment','relations','ownership','authority','dependencies']),cameras:new Map(),rx:-18,ry:28,z3:1};const $=q=>document.querySelector(q);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));async function gj(u){const r=await fetch(u),d=await r.json();if(!r.ok)throw d;return d}function st(t,b=false){$('#status').textContent=t;$('#status').className='status '+(b?'bad':'ok')}
function cam(){if(!S.cameras.has(S.view))S.cameras.set(S.view,{x:0,y:0,z:1,baseW:1000,baseH:700});return S.cameras.get(S.view)}function applyCam(){const c=cam(),svg=$('#canvas');svg.setAttribute('viewBox',`${c.x} ${c.y} ${c.baseW/c.z} ${c.baseH/c.z}`);$('#zoomread').textContent=Math.round(c.z*100)+'%'}function fitCamera(w,h){const rect=$('#svgView').getBoundingClientRect(),pad=.94,scale=Math.min(rect.width/w,rect.height/h)*pad,c=cam();c.baseW=rect.width;c.baseH=rect.height;c.z=Math.max(.05,scale);c.x=(w-rect.width/c.z)/2;c.y=(h-rect.height/c.z)/2;applyCam()}
function wheelZoom(e){if($('#svgView').classList.contains('hidden'))return;e.preventDefault();const svg=$('#canvas'),c=cam(),r=svg.getBoundingClientRect();c.baseW=r.width;c.baseH=r.height;const beforeW=r.width/c.z,beforeH=r.height/c.z;const mx=(e.clientX-r.left)/r.width,my=(e.clientY-r.top)/r.height;const worldX=c.x+mx*beforeW,worldY=c.y+my*beforeH;const factor=Math.exp(-e.deltaY*.0015),next=Math.min(20,Math.max(.03,c.z*factor));const afterW=r.width/next,afterH=r.height/next;c.z=next;c.x=worldX-mx*afterW;c.y=worldY-my*afterH;applyCam()}
let drag=null;function panStart(e){if(e.button!==0||e.target.closest('.node'))return;const c=cam();drag={sx:e.clientX,sy:e.clientY,x:c.x,y:c.y};$('#svgView').setPointerCapture?.(e.pointerId)}function panMove(e){if(!drag)return;const c=cam(),r=$('#canvas').getBoundingClientRect();c.x=drag.x-(e.clientX-drag.sx)/(r.width)*(r.width/c.z);c.y=drag.y-(e.clientY-drag.sy)/(r.height)*(r.height/c.z);applyCam()}function panEnd(){drag=null}
async function init(){S.cms=await gj('/api/nanocms');S.page=S.cms.default_page;nav();await resolvePage();const b=await gj('/api/branches');$('#repo').textContent=b.repository;$('#branch').innerHTML=b.branches.map(x=>`<option>${esc(x.name)}</option>`).join('');if(b.branches.some(x=>x.name==='main'))$('#branch').value='main';await load()}
function nav(){$('#nav').innerHTML=S.cms.navigation.map(x=>`<button data-page="${x.id}" class="${x.id===S.page?'active':''}">${esc(x.menuitem)}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=async()=>{S.page=b.dataset.page;S.selected=null;nav();await resolvePage();await load()})}
async function resolvePage(){const p=await gj('/api/nanocms?page='+encodeURIComponent(S.page));S.cms=p;S.view=p.selected_page.placements[0].id;views(p.selected_page.placements)}function views(ps){$('#views').innerHTML=ps.map(p=>`<button data-view="${p.id}" class="${p.id===S.view?'active':''}">${esc(p.title)}</button>`).join('');$('#views').querySelectorAll('button').forEach(b=>b.onclick=async()=>{S.view=b.dataset.view;views(ps);await load(true)})}
function url(){const q=new URLSearchParams({branch:$('#branch').value,page:S.page,view:S.view});if(S.page==='raw-json'&&$('#jsonFile').value)q.set('path',$('#jsonFile').value);if(S.selected)q.set('context',S.selected);return'/api/project?'+q}async function load(keep=false){const sel=keep?S.selected:null;st('loading');try{const d=await gj(url());S.data=d;$('#rev').textContent=d.source.revision.slice(0,12);if(sel&&d.graph.nodes.some(n=>n.id===sel))S.selected=sel;else if(!keep)S.selected=null;if(d.ruleset==='RawJSON'){const fs=d.source.available_json_files||[];$('#fileWrap').classList.remove('hidden');$('#jsonFile').innerHTML=fs.map(p=>`<option value="${esc(p)}" ${p===d.source.path?'selected':''}>${esc(p)}</option>`).join('')}else $('#fileWrap').classList.add('hidden');st(`${d.page.title} · ${d.placement.title} · ${d.graph.nodes.length}`);render();inspect(S.selected)}catch(e){showErr(e.errors||[{id:'SP_UI',message:String(e)}]);st('invalid',true)}}
function showErr(es){$('#world').innerHTML='';$('#scene3d').innerHTML='';$('#inspector').innerHTML=`<h2>Preflight failed</h2><div class="error">${es.map(e=>`<p><strong>${esc(e.id)}</strong><br>${esc(e.message)}</p>`).join('')}</div>`}
function levels(ns,es){const ch=new Map(ns.map(n=>[n.id,[]])),par=new Set();es.filter(e=>e.dimension==='containment').forEach(e=>{if(ch.has(e.source))ch.get(e.source).push(e.target);par.add(e.target)});const lv=[],seen=new Set();function w(ids,d){lv[d]??=[];ids.forEach(id=>{if(seen.has(id))return;seen.add(id);lv[d].push(id);w(ch.get(id)||[],d+1)})}w(ns.filter(n=>!par.has(n.id)).map(n=>n.id),0);ns.forEach(n=>{if(!seen.has(n.id)){lv[0]??=[];lv[0].push(n.id)}});return lv}
function render(){const r=S.data?.placement?.renderer;$('#svgView').classList.toggle('hidden',r==='javascript_3d');$('#space3d').classList.toggle('hidden',r!=='javascript_3d');if(r==='javascript_3d')r3();else if(r==='svg_master_map')rmap();else rtree()}
function rtree(){const ns=S.data.graph.nodes,es=S.data.graph.edges,lv=levels(ns,es),pos=new Map(),xg=220,yg=118;lv.forEach((ids,d)=>ids.forEach((id,i)=>pos.set(id,{x:70+i*xg,y:95+d*yg})));const w=Math.max(900,...lv.map(x=>x.length*xg+140)),h=Math.max(600,lv.length*yg+150);let o='';es.filter(e=>S.visible.has(e.dimension)).forEach(e=>{const a=pos.get(e.source),b=pos.get(e.target);if(a&&b)o+=`<path class="edge" d="M${a.x+85},${a.y+26} L${b.x+85},${b.y+26}"/>`});ns.forEach(n=>{const p=pos.get(n.id);o+=`<g class="node ${S.selected===n.id?'selected':''}" data-id="${esc(n.id)}" transform="translate(${p.x},${p.y})"><rect width="170" height="52" rx="12"/><text class="name" x="9" y="20">${esc((n.name||n.id).slice(0,24))}</text><text class="type" x="9" y="39">${esc((n.type||n.kind||'').slice(0,27))}</text></g>`});$('#world').innerHTML=o;bind($('#world'));if(!S.cameras.has(S.view))fitCamera(w,h);else applyCam()}
function rmap(){const p=S.data.projection;if(!p){showErr([{id:'SP_MAP_PROJECTION',message:'Map projection missing from backend.'}]);return}const g=p.grid||{},vb=p.view_box;let o=`<defs><pattern id="grid" width="${g.cell_px||56}" height="${g.cell_px||56}" patternUnits="userSpaceOnUse"><path d="M${g.cell_px||56} 0H0V${g.cell_px||56}" fill="none" stroke="${g.stroke||'#AAB2C2'}" stroke-opacity="${g.opacity??.055}"/></pattern></defs><rect width="${vb.width}" height="${vb.height}" fill="url(#grid)"/>`;for(const x of p.occurrences){if(x.role==='frame')o+=`<g class="node ${S.selected===x.id?'selected':''}" data-id="${esc(x.id)}"><rect class="map-frame" x="${x.x}" y="${x.y}" width="${x.width}" height="${x.height}" rx="20"/><text class="map-title" x="${x.x+30}" y="${x.y+38}">${esc(x.title)}</text><text class="map-sub" x="${x.x+30}" y="${x.y+58}">${esc(x.subtitle)}</text></g>`;else if(x.role==='section')o+=`<g class="node ${S.selected===x.id?'selected':''}" data-id="${esc(x.id)}"><rect class="map-section" x="${x.x}" y="${x.y}" width="${x.width}" height="${x.height}" rx="20"/><text class="map-title" x="${x.x+25}" y="${x.y+32}">${esc(x.title)}</text></g>`;else if(x.role==='card')o+=`<g class="node ${S.selected===x.id?'selected':''}" data-id="${esc(x.id)}"><rect class="map-card" x="${x.x}" y="${x.y}" width="${x.width}" height="${x.height}" rx="12"/><rect x="${x.x}" y="${x.y}" width="${x.width}" height="5" rx="2.5" fill="#087CFF"/><text class="map-title" x="${x.x+16}" y="${x.y+31}">${esc(x.title)}</text><text class="map-sub" x="${x.x+16}" y="${x.y+51}">${esc(x.subtitle)}</text>${x.deeper_descendants?`<text class="map-sub" x="${x.x+16}" y="${x.y+x.height-10}">+${x.deeper_descendants} deeper</text>`:''}</g>`;else o+=`<g class="node ${S.selected===x.id?'selected':''}" data-id="${esc(x.id)}"><rect class="map-chip" x="${x.x}" y="${x.y}" width="${x.width}" height="${x.height}" rx="9"/><text class="map-key" x="${x.x+8}" y="${x.y+16}">${esc((x.title||'').slice(0,32))}</text>${x.value!==null&&x.value!==undefined?`<text class="map-value" x="${x.x+x.width*.48}" y="${x.y+16}">${esc(JSON.stringify(x.value).slice(0,50))}</text>`:''}</g>`}$('#world').innerHTML=o;bind($('#world'));if(!S.cameras.has(S.view))fitCamera(vb.width,vb.height);else applyCam()}
function bind(root){root.querySelectorAll('.node').forEach(n=>n.onclick=e=>{e.stopPropagation();select(n.dataset.id)})}function r3(){const ns=S.data.graph.nodes,lv=levels(ns,S.data.graph.edges),pos=new Map();lv.forEach((ids,d)=>{const rad=Math.max(170,ids.length*42);ids.forEach((id,i)=>{const a=2*Math.PI*i/Math.max(1,ids.length);pos.set(id,{x:Math.cos(a)*rad,y:(d-lv.length/2)*120,z:Math.sin(a)*rad})})});$('#scene3d').innerHTML=ns.map(n=>{const p=pos.get(n.id);return`<div class="n3 ${S.selected===n.id?'selected':''}" data-id="${esc(n.id)}" style="transform:translate3d(${p.x}px,${p.y}px,${p.z}px)"><b>${esc((n.name||n.id).slice(0,24))}</b><small>${esc((n.type||'').slice(0,28))}</small></div>`}).join('');$('#scene3d').style.transform=`scale(${S.z3}) rotateX(${S.rx}deg) rotateY(${S.ry}deg)`;bind($('#scene3d'))}
function select(id){S.selected=id;render();inspect(id)}function inspect(id){if(!id){$('#inspector').innerHTML='<h2>Inspector</h2><div class="muted">Select a node.</div>';return}const n=S.data.graph.nodes.find(n=>n.id===id),inc=S.data.graph.edges.filter(e=>e.target===id),out=S.data.graph.edges.filter(e=>e.source===id);$('#inspector').innerHTML=`<h2>${esc(n.name)}</h2><p class="muted">${esc(n.id)}</p><p><b>Type:</b> ${esc(n.type)}</p>${n.pointer?`<p><b>Pointer:</b> ${esc(n.pointer)}</p>`:''}<p><b>Source:</b> ${esc(n.source)}</p><h3>Incoming ${inc.length}</h3><h3>Outgoing ${out.length}</h3><pre>${esc(JSON.stringify(n.raw,null,2))}</pre>`}
$('#reload').onclick=()=>load();$('#branch').onchange=()=>{S.cameras.clear();load()};$('#jsonFile').onchange=()=>{S.selected=null;S.cameras.clear();load()};$('#fit').onclick=()=>{S.cameras.delete(S.view);render()};document.querySelectorAll('[data-dim]').forEach(c=>c.onchange=()=>{c.checked?S.visible.add(c.dataset.dim):S.visible.delete(c.dataset.dim);render()});$('#svgView').addEventListener('wheel',wheelZoom,{passive:false});$('#svgView').addEventListener('pointerdown',panStart);$('#svgView').addEventListener('pointermove',panMove);$('#svgView').addEventListener('pointerup',panEnd);$('#svgView').addEventListener('pointercancel',panEnd);init().catch(e=>showErr([{id:'SP_UI_INIT',message:String(e)}]));
</script></body></html>
