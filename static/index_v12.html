<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StructureProjector</title>
<style>
:root{--b:#020304;--w:#F8FAFF;--blue:#087CFF;--red:#FF176B;--silver:#AAB2C2;--gold:#FFD83D;--neutral:#394252}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--b);color:var(--w);font:14px/1.35 Inter,"Segoe UI",Arial,sans-serif}header{height:62px;display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:2px solid var(--blue)}header strong{font-size:19px}.spacer{flex:1}.muted{font-size:12px;color:var(--silver)}button,select,input{background:var(--b);color:var(--w);border:1px solid var(--silver);border-radius:9px;padding:7px 10px}button{cursor:pointer}button.active{border:2px solid var(--blue);color:var(--blue)}nav{height:46px;padding:6px 10px;border-bottom:1px solid var(--neutral);display:flex;align-items:center;gap:7px}.shell{height:calc(100vh - 108px);display:grid;grid-template-columns:minmax(0,1fr) 390px}.main{position:relative;overflow:hidden}.side{border-left:1px solid var(--neutral);overflow:auto}.panel{padding:14px;border-bottom:1px solid var(--neutral)}.panel h2,.panel h3{margin:0 0 10px}.bar{position:absolute;z-index:30;top:10px;left:10px;right:10px;display:flex;align-items:flex-start;gap:8px;pointer-events:none}.views,.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:7px;background:#020304ee;border:1px solid var(--neutral);border-radius:11px;pointer-events:auto}.tools{margin-left:auto}.views{max-width:calc(100% - 220px)}.status{border:1px solid var(--silver);border-radius:999px;padding:3px 8px;font-size:11px}.status.ok{border-color:var(--blue);color:var(--blue)}.status.bad{border-color:var(--red);color:var(--red)}.viewport{position:absolute;inset:0;overflow:hidden}.hidden{display:none!important}svg{width:100%;height:100%;display:block;user-select:none}.grid{stroke:var(--silver);stroke-width:.6;opacity:.06}.edge{fill:none;stroke:var(--silver);stroke-width:1.2}.edge.containment{stroke:var(--blue)}.edge.ownership,.edge.authority{stroke:var(--red)}.edge.dependencies{stroke:var(--gold)}.card,.groupbox{fill:#020304;stroke:var(--neutral);stroke-width:1.4}.groupbox{stroke:var(--blue);stroke-width:2}.node{cursor:pointer}.node:hover .card,.node.selected .card{stroke-width:3}.s-unlocked{stroke:var(--gold)!important}.s-locked{stroke:var(--blue)!important}.s-validated{stroke:var(--silver)!important}.s-special{stroke:var(--red)!important}.nt{fill:var(--w);font-size:12px;font-weight:800}.ns{fill:var(--silver);font-size:9px}.gt{fill:var(--w);font-size:16px;font-weight:900}.gc{fill:var(--blue);font-size:10px;font-weight:800}.matrix-label{fill:var(--silver);font-size:8px}.matrix-cell{stroke:none}.matrix-cell.containment{fill:var(--blue)}.matrix-cell.relations{fill:var(--silver)}.matrix-cell.ownership,.matrix-cell.authority{fill:var(--red)}.matrix-cell.dependencies{fill:var(--gold)}#space3d{perspective:1100px;background:radial-gradient(circle at center,#07101c 0,#020304 55%)}#scene3d{position:absolute;left:50%;top:50%;transform-style:preserve-3d}.node3d{position:absolute;transform-style:preserve-3d;min-width:130px;max-width:180px;padding:8px 10px;border:1.5px solid var(--neutral);border-radius:9px;background:#020304e8;color:var(--w);font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node3d.s-unlocked{border-color:var(--gold)}.node3d.s-locked{border-color:var(--blue)}.node3d.s-validated{border-color:var(--silver)}.node3d.s-special{border-color:var(--red)}.node3d.selected{border-width:3px}.plane3d{position:absolute;border:1px solid #087cff33;background:#087cff08;transform-style:preserve-3d;pointer-events:none}.line3d{position:absolute;height:1px;background:var(--silver);transform-origin:0 0;pointer-events:none}.control{margin:10px 0 14px}.control-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:5px}.control label{font-size:12px;color:var(--silver)}.control output{font:11px ui-monospace,monospace;color:var(--w)}.control input[type=range]{width:100%;padding:0;accent-color:var(--blue)}.preset-row{display:flex;gap:7px;align-items:center;margin-bottom:9px}.preset-row select{min-width:0;flex:1}.mini{padding:6px 8px}.kv{margin-bottom:12px}.kv b{display:block;color:var(--blue);font-size:11px;margin-bottom:2px}.badge{display:inline-block;border:1px solid var(--neutral);border-radius:999px;padding:2px 7px;font-size:10px}.badge.unlocked{border-color:var(--gold);color:var(--gold)}.badge.locked{border-color:var(--blue);color:var(--blue)}.badge.validated{border-color:var(--silver);color:var(--silver)}.badge.special{border-color:var(--red);color:var(--red)}pre{white-space:pre-wrap;word-break:break-word;border:1px solid var(--neutral);border-radius:9px;padding:9px;font:10px/1.4 ui-monospace,monospace}
</style>
</head>
<body>
<header><strong>StructureProjector</strong><span id="status" class="status">idle</span><span id="repo" class="muted"></span><div class="spacer"></div><label>Branch <select id="branch"></select></label><button id="reload">Reload</button><span id="revision" class="muted"></span></header>
<nav id="nav"></nav>
<div class="shell"><main class="main"><div class="bar"><div id="views" class="views"></div><div class="tools"><label id="jsonWrap" class="hidden">JSON <select id="jsonFile"></select></label><button id="fit">Fit</button><span id="zoom" class="muted">100%</span></div></div><div id="svgView" class="viewport"><svg id="canvas"><defs><pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" class="grid" fill="none"/></pattern></defs><rect x="-10000" y="-10000" width="20000" height="20000" fill="url(#grid)"/><g id="world"></g></svg></div><div id="space3d" class="viewport hidden"><div id="scene3d"></div></div></main><aside class="side"><section id="controls" class="panel"><h2>Projection Controls</h2><div class="muted">Select a canonical projection.</div></section><section id="inspector" class="panel"><h2>Inspector</h2><div class="muted">Select a node.</div></section></aside></div>
<script>
const PRESET_KEY='structureprojector.projection.presets.v1';
const S={cms:null,page:null,view:null,data:null,selected:null,cameras:new Map(),params:new Map(),rotX:-18,rotY:28,z3:1,drag3:null,reloadTimer:null};
const $=q=>document.querySelector(q);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function gj(url){const r=await fetch(url),d=await r.json();if(!r.ok)throw d;return d}function st(t,b=false){$('#status').textContent=t;$('#status').className='status '+(b?'bad':'ok')}
function statusClass(s){s=String(s||'').toLowerCase();if(s==='unlocked')return's-unlocked';if(s==='locked')return's-locked';if(s==='validated')return's-validated';if(['superseded','deprecated','rejected','invalid','failed','conflict','error'].includes(s))return's-special';return''}
function badge(s){if(!s)return'';let c=statusClass(s).replace('s-','');return`<span class="badge ${c}">${esc(s)}</span>`}
function cam(){if(!S.cameras.has(S.view))S.cameras.set(S.view,{x:0,y:0,z:1,bw:1000,bh:700});return S.cameras.get(S.view)}function applyCam(){const c=cam(),r=$('#svgView').getBoundingClientRect();c.bw=r.width||1000;c.bh=r.height||700;$('#canvas').setAttribute('viewBox',`${c.x} ${c.y} ${c.bw/c.z} ${c.bh/c.z}`);$('#zoom').textContent=Math.round(c.z*100)+'%'}function fitBox(b,p=.94){const r=$('#svgView').getBoundingClientRect(),c=cam(),w=Math.max(1,b.width),h=Math.max(1,b.height),z=Math.max(.02,Math.min(24,Math.min(r.width/w,r.height/h)*p));c.bw=r.width;c.bh=r.height;c.z=z;c.x=(b.x||0)-(r.width/z-w)/2;c.y=(b.y||0)-(r.height/z-h)/2;applyCam()}
function wheel2(e){if($('#svgView').classList.contains('hidden'))return;e.preventDefault();const r=$('#canvas').getBoundingClientRect(),c=cam(),bw=r.width/c.z,bh=r.height/c.z,mx=(e.clientX-r.left)/r.width,my=(e.clientY-r.top)/r.height,wx=c.x+mx*bw,wy=c.y+my*bh,nz=Math.min(24,Math.max(.02,c.z*Math.exp(-e.deltaY*.0015))),aw=r.width/nz,ah=r.height/nz;c.z=nz;c.x=wx-mx*aw;c.y=wy-my*ah;applyCam()}let drag=null;function pd(e){if(e.button||e.target.closest('.node'))return;const c=cam();drag={sx:e.clientX,sy:e.clientY,x:c.x,y:c.y}}function pm(e){if(!drag)return;const c=cam();c.x=drag.x-(e.clientX-drag.sx)/c.z;c.y=drag.y-(e.clientY-drag.sy)/c.z;applyCam()}function pu(){drag=null}
async function init(){S.cms=await gj('/api/nanocms');S.page=S.cms.default_page;renderNav();await resolvePage();const b=await gj('/api/branches');$('#repo').textContent=b.repository;$('#branch').innerHTML=b.branches.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('');if(b.branches.some(x=>x.name==='main'))$('#branch').value='main';await load()}
function renderNav(){$('#nav').innerHTML=S.cms.navigation.map(x=>`<button data-page="${esc(x.id)}" class="${x.id===S.page?'active':''}">${esc(x.menuitem)}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=async()=>{S.page=b.dataset.page;S.selected=null;renderNav();await resolvePage();await load()})}
async function resolvePage(){const p=await gj('/api/nanocms?page='+encodeURIComponent(S.page));S.cms=p;S.view=p.selected_page.placements[0].id;renderViews(p.selected_page.placements)}
function renderViews(ps){$('#views').innerHTML=ps.map(p=>`<button data-view="${esc(p.id)}" class="${p.id===S.view?'active':''}">${esc(p.title)}</button>`).join('');$('#views').querySelectorAll('button').forEach(b=>b.onclick=async()=>{S.view=b.dataset.view;S.selected=null;renderViews(ps);await load()})}
function currentParams(){return S.params.get(S.view)||{}}
function projectUrl(){const q=new URLSearchParams({branch:$('#branch').value,page:S.page,view:S.view});if(S.page==='raw-json'&&$('#jsonFile').value)q.set('path',$('#jsonFile').value);const p=currentParams();if(Object.keys(p).length)q.set('params',JSON.stringify(p));return'/api/project?'+q}
async function load({keepCamera=false}={}){st('loading');try{S.data=await gj(projectUrl());$('#revision').textContent=(S.data.source?.revision||'').slice(0,12);if(S.data.ruleset==='RawJSON'){const fs=S.data.source.available_json_files||[];$('#jsonWrap').classList.remove('hidden');const prior=$('#jsonFile').value;$('#jsonFile').innerHTML=fs.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');if(prior&&fs.includes(prior))$('#jsonFile').value=prior;else if(S.data.source.path)$('#jsonFile').value=S.data.source.path}else $('#jsonWrap').classList.add('hidden');if(S.data.projection?.control_values&&!S.params.has(S.view))S.params.set(S.view,{...S.data.projection.control_values});st(`${S.data.page.title} · ${S.data.placement.title}`);render(keepCamera);renderControls();inspect(null)}catch(e){st('invalid',true);$('#world').innerHTML='';$('#scene3d').innerHTML='';$('#inspector').innerHTML=`<h2>Error</h2><pre>${esc(JSON.stringify(e,null,2))}</pre>`}}
function render(keepCamera=false){const r=S.data?.placement?.renderer,is3=r==='canonical_projection_3d';$('#svgView').classList.toggle('hidden',is3);$('#space3d').classList.toggle('hidden',!is3);if(is3)render3d();else if(r==='canonical_projection_2d')renderCanonical2d(!keepCamera);else if(r==='svg_master_map')renderRawMap();else renderRawTree()}
function edgePath(a,b,e,opacity){return`<path class="edge ${esc(e.dimension||'')}" style="opacity:${opacity}" d="M${a.x+a.width/2},${a.y+a.height/2} L${b.x+b.width/2},${b.y+b.height/2}"/>`}
function groupBox(g){return`<g><rect class="groupbox" x="${g.x}" y="${g.y}" width="${g.width}" height="${g.height}" rx="18"/><text class="gt" x="${g.x+16}" y="${g.y+28}">${esc(g.title)}</text><text class="gc" x="${g.x+g.width-14}" y="${g.y+24}" text-anchor="end">${g.count??''}</text></g>`}
function card(n,labelScale=1){const sc=statusClass(n.status),sel=S.selected===n.id?' selected':'';return`<g class="node${sel}" data-id="${esc(n.id)}"><rect class="card ${sc}" x="${n.x}" y="${n.y}" width="${n.width}" height="${n.height}" rx="9"/><text class="nt" style="font-size:${12*labelScale}px" x="${n.x+10}" y="${n.y+21}">${esc((n.name||n.id||'').slice(0,48))}</text><text class="ns" style="font-size:${9*labelScale}px" x="${n.x+10}" y="${n.y+39}">${esc((n.type||n.source_role||'').slice(0,56))}</text></g>`}
function circleNode(n,labelScale=1){const sc=statusClass(n.status),sel=S.selected===n.id?' selected':'';return`<g class="node${sel}" data-id="${esc(n.id)}"><circle class="card ${sc}" cx="${n.x}" cy="${n.y}" r="${n.radius||32}"/><text class="nt" style="font-size:${11*labelScale}px" x="${n.x}" y="${n.y+4}" text-anchor="middle">${esc((n.name||n.id||'').slice(0,22))}</text></g>`}
function bind2d(nodes){const map=new Map(nodes.map(n=>[String(n.id),n]));$('#world').querySelectorAll('.node').forEach(el=>{el.onclick=e=>{e.stopPropagation();const n=map.get(el.dataset.id);if(n){S.selected=n.id;inspect(n);renderCanonical2d(false)}};el.ondblclick=e=>{e.stopPropagation();const n=map.get(el.dataset.id);if(n&&n.width)fitBox({x:n.x,y:n.y,width:n.width,height:n.height},.75)}})}
function renderCanonical2d(refit=true){const p=S.data.projection;if(!p)return;let html='';if(p.kind==='matrix'){html=renderMatrix(p);$('#world').innerHTML=html;if(refit||!S.cameras.has(S.view)){const size=p.label_size+p.order.length*p.cell_size+60;fitBox({x:0,y:0,width:size,height:size})}else applyCam();return}const nodes=p.nodes||[],pos=new Map(nodes.map(n=>[String(n.id),n])),op=p.style?.edge_opacity??.4,ls=p.style?.label_scale??1;for(const g of p.groups||[])html+=groupBox(g);for(const e of p.edges||[]){const a=pos.get(String(e.source)),b=pos.get(String(e.target));if(a&&b&&a.width&&b.width)html+=edgePath(a,b,e,op);else if(a&&b&&p.kind==='web')html+=`<path class="edge ${esc(e.dimension||'')}" style="opacity:${op}" d="M${a.x},${a.y} L${b.x},${b.y}"/>`}for(const n of nodes)html+=p.kind==='web'?circleNode(n,ls):card(n,ls);$('#world').innerHTML=html;bind2d(nodes);if(refit||!S.cameras.has(S.view)){const b=p.bounds||{width:2600,height:1800};fitBox({x:0,y:0,width:b.width,height:b.height})}else applyCam()}
function renderMatrix(p){const cs=p.cell_size,ls=p.label_size,n=p.order.length,labelScale=p.style?.label_scale??1,op=p.style?.cell_opacity??.72;let h='';for(let i=0;i<n;i++){const lab=esc((p.order[i].name||p.order[i].id).slice(0,38));h+=`<text class="matrix-label" style="font-size:${8*labelScale}px" x="${ls-6}" y="${ls+i*cs+cs*.75}" text-anchor="end">${lab}</text><text class="matrix-label" style="font-size:${8*labelScale}px" transform="translate(${ls+i*cs+cs*.65},${ls-6}) rotate(-60)" text-anchor="start">${lab}</text>`}for(const c of p.cells)h+=`<rect class="matrix-cell ${esc(c.dimension)}" x="${ls+c.col*cs}" y="${ls+c.row*cs}" width="${Math.max(1,cs-1)}" height="${Math.max(1,cs-1)}" opacity="${op}"/>`;return h}
function rawLayout(g){const nodes=g.nodes||[],edges=g.edges||[],children=new Map(nodes.map(n=>[n.id,[]])),incoming=new Set();for(const e of edges){if(e.dimension==='containment'&&children.has(e.source)&&children.has(e.target)){children.get(e.source).push(e.target);incoming.add(e.target)}}const roots=nodes.filter(n=>!incoming.has(n.id)),depth=new Map(),queue=roots.map(n=>[n.id,0]);for(let i=0;i<queue.length;i++){const [id,d]=queue[i];if(depth.has(id))continue;depth.set(id,d);for(const c of children.get(id)||[])queue.push([c,d+1])}const levels=new Map();for(const n of nodes){const d=depth.get(n.id)||0;if(!levels.has(d))levels.set(d,[]);levels.get(d).push(n)}const out=[];for(const [d,arr] of [...levels].sort((a,b)=>a[0]-b[0]))arr.sort((a,b)=>String(a.id).localeCompare(String(b.id))).forEach((n,i)=>out.push({...n,x:80+i*260,y:110+d*130,width:230,height:70}));return{nodes:out,edges,bounds:{width:Math.max(1000,...out.map(n=>n.x+n.width+80)),height:Math.max(700,...out.map(n=>n.y+n.height+80))}}}
function renderRawTree(){const q=rawLayout(S.data.graph||{});S.data.projection={kind:'tree',...q};renderCanonical2d()}function renderRawMap(){const p=S.data.projection;if(!p)return;const nodes=(p.occurrences||[]).map(o=>({id:o.id,name:o.title,type:o.subtitle,status:o.status,x:o.x,y:o.y,width:o.width,height:o.height}));S.data.projection={kind:'map',nodes,edges:[],groups:[],bounds:{width:p.view_box.width,height:p.view_box.height}};renderCanonical2d()}
function inspect(n){if(!n){$('#inspector').innerHTML='<h2>Inspector</h2><div class="muted">Select a node.</div>';return}$('#inspector').innerHTML=`<h2>${esc(n.name||n.id)}</h2><div class="kv">${badge(n.status)}</div><div class="kv"><b>Identity</b>${esc(n.id)}</div><div class="kv"><b>Type</b>${esc(n.type||'')}</div><div class="kv"><b>Source role</b>${esc(n.source_role||'')}</div><div class="kv"><b>Source</b>${esc(n.source||'')}</div><div class="kv"><b>Projection</b>${esc(S.data?.projection?.title||S.data?.placement?.title||'')}</div>`}
function render3d(){const p=S.data.projection;if(!p)return;const scene=$('#scene3d'),nodes=p.nodes||[],pos=new Map(nodes.map(n=>[String(n.id),n])),op=p.style?.edge_opacity??.22,nodeScale=p.style?.node_scale??1,labelScale=p.style?.label_scale??1;$('#space3d').style.perspective=(p.style?.perspective??1100)+'px';let h='';for(const g of p.groups||[]){if(g.y!==undefined&&p.kind==='layers')h+=`<div class="plane3d" style="width:1200px;height:800px;transform:translate3d(-600px,${g.y-400}px,-400px) rotateX(90deg)"></div>`}for(const e of p.edges||[]){const a=pos.get(String(e.source)),b=pos.get(String(e.target));if(!a||!b)continue;const dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z,len=Math.sqrt(dx*dx+dy*dy+dz*dz),yaw=Math.atan2(dz,dx)*180/Math.PI,pitch=-Math.atan2(dy,Math.sqrt(dx*dx+dz*dz))*180/Math.PI;h+=`<div class="line3d" style="opacity:${op};width:${len}px;transform:translate3d(${a.x}px,${a.y}px,${a.z}px) rotateY(${-yaw}deg) rotateZ(${pitch}deg)"></div>`}for(const n of nodes){const sc=statusClass(n.status),sel=S.selected===n.id?' selected':'';h+=`<div class="node3d ${sc}${sel}" data-id="${esc(n.id)}" title="${esc(n.name||n.id)}" style="font-size:${11*labelScale}px;transform:translate3d(${n.x}px,${n.y}px,${n.z}px) translate(-50%,-50%) scale(${nodeScale})">${esc((n.name||n.id).slice(0,28))}</div>`}scene.innerHTML=h;scene.querySelectorAll('.node3d').forEach(el=>el.onclick=e=>{e.stopPropagation();const n=pos.get(el.dataset.id);if(n){S.selected=n.id;inspect(n);render3d()}});apply3d()}
function apply3d(){const extent=S.data?.projection?.extent||900,scale=(700/extent)*S.z3;$('#scene3d').style.transform=`rotateX(${S.rotX}deg) rotateY(${S.rotY}deg) scale(${scale})`;$('#zoom').textContent=Math.round(S.z3*100)+'%'}
function readPresetStore(){try{return JSON.parse(localStorage.getItem(PRESET_KEY)||'{}')}catch{return{}}}function writePresetStore(v){localStorage.setItem(PRESET_KEY,JSON.stringify(v))}function presetBucket(){const id=S.data?.projection?.id;if(!id)return{};const store=readPresetStore();return store[id]||{}}
function renderControls(){const p=S.data?.projection;if(!p?.control_schema?.length){$('#controls').innerHTML='<h2>Projection Controls</h2><div class="muted">This view has no projection parameters.</div>';return}const built=p.builtin_presets||{},user=presetBucket(),opts=['<option value="">Preset…</option>',...Object.keys(built).map(n=>`<option value="builtin:${esc(n)}">★ ${esc(n)}</option>`),...Object.keys(user).map(n=>`<option value="user:${esc(n)}">${esc(n)}</option>`)];let h=`<h2>Projection Controls</h2><div class="preset-row"><select id="presetSelect">${opts.join('')}</select><button id="savePreset" class="mini">Save</button><button id="deletePreset" class="mini">Delete</button></div><button id="resetParams" class="mini">Defaults</button>`;for(const c of p.control_schema){const v=p.control_values?.[c.id]??c.default;h+=`<div class="control"><div class="control-head"><label>${esc(c.label)}</label><output id="out-${esc(c.id)}">${v}</output></div><input type="range" data-param="${esc(c.id)}" min="${c.min}" max="${c.max}" step="${c.step}" value="${v}"></div>`}$('#controls').innerHTML=h;$('#controls').querySelectorAll('input[data-param]').forEach(inp=>inp.oninput=()=>{const vals={...(S.params.get(S.view)||p.control_values||{})};vals[inp.dataset.param]=Number(inp.value);S.params.set(S.view,vals);const out=document.getElementById('out-'+inp.dataset.param);if(out)out.value=inp.value;clearTimeout(S.reloadTimer);S.reloadTimer=setTimeout(()=>load({keepCamera:true}),120)});$('#presetSelect').onchange=e=>{const v=e.target.value;if(!v)return;const [kind,...rest]=v.split(':'),name=rest.join(':');const values=kind==='builtin'?built[name]:user[name]?.values;if(values){S.params.set(S.view,{...values});load({keepCamera:false})}};$('#savePreset').onclick=()=>savePreset();$('#deletePreset').onclick=()=>deletePreset();$('#resetParams').onclick=()=>{S.params.set(S.view,Object.fromEntries(p.control_schema.map(c=>[c.id,c.default])));load({keepCamera:false})}}
function savePreset(){const p=S.data?.projection;if(!p?.id)return;const name=prompt('Preset name');if(!name)return;const store=readPresetStore();store[p.id]=store[p.id]||{};store[p.id][name]={schema_version:p.control_schema_version,values:{...(S.params.get(S.view)||p.control_values||{})}};writePresetStore(store);renderControls()}
function deletePreset(){const sel=$('#presetSelect');if(!sel||!sel.value.startsWith('user:'))return;const name=sel.value.slice(5),p=S.data?.projection,store=readPresetStore();if(store[p.id]?.[name]){delete store[p.id][name];if(!Object.keys(store[p.id]).length)delete store[p.id];writePresetStore(store);renderControls()}}
$('#canvas').addEventListener('wheel',wheel2,{passive:false});$('#canvas').addEventListener('mousedown',pd);window.addEventListener('mousemove',pm);window.addEventListener('mouseup',pu);$('#space3d').addEventListener('mousedown',e=>{if(e.target.closest('.node3d'))return;S.drag3={x:e.clientX,y:e.clientY,rx:S.rotX,ry:S.rotY}});window.addEventListener('mousemove',e=>{if(!S.drag3)return;S.rotY=S.drag3.ry+(e.clientX-S.drag3.x)*.35;S.rotX=S.drag3.rx-(e.clientY-S.drag3.y)*.35;apply3d()});window.addEventListener('mouseup',()=>S.drag3=null);$('#space3d').addEventListener('wheel',e=>{e.preventDefault();S.z3=Math.min(8,Math.max(.15,S.z3*Math.exp(-e.deltaY*.0014)));apply3d()},{passive:false});$('#reload').onclick=()=>load();$('#branch').onchange=()=>load();$('#jsonFile').onchange=()=>load();$('#fit').onclick=()=>{if($('#space3d').classList.contains('hidden')){const p=S.data?.projection;if(p?.bounds)fitBox({x:0,y:0,width:p.bounds.width,height:p.bounds.height});else if(p?.view_box)fitBox({x:0,y:0,width:p.view_box.width,height:p.view_box.height})}else{S.rotX=-18;S.rotY=28;S.z3=1;apply3d()}};window.addEventListener('resize',()=>$('#space3d').classList.contains('hidden')?applyCam():apply3d());init();
