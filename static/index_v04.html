<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StructureProjector</title>
<style>
:root{color-scheme:dark;--black:#020304;--white:#F8FAFF;--blue:#087CFF;--red:#FF176B;--silver:#AAB2C2;--gold:#FFD83D}
*{box-sizing:border-box}body{margin:0;background:var(--black);color:var(--white);font:14px/1.4 Inter,"Segoe UI",Arial,sans-serif;height:100vh;overflow:hidden}
header{min-height:64px;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2px solid var(--blue)}header strong{font-size:18px}.meta{color:var(--silver);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spacer{flex:1}
nav{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--silver)}nav button,.views button{background:var(--black);border:1px solid var(--silver);color:var(--silver);border-radius:10px;padding:8px 12px;cursor:pointer}nav button.active,.views button.active{border:2px solid var(--blue);color:var(--blue)}
select,button{font:inherit;background:var(--black);color:var(--white);border:1px solid var(--silver);border-radius:10px;padding:8px 10px}button{cursor:pointer}.shell{height:calc(100vh - 111px);display:grid;grid-template-columns:minmax(0,1fr) 380px}.main{position:relative;overflow:hidden}.viewbar{position:absolute;left:12px;top:12px;z-index:4;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 24px)}.views{display:flex;gap:6px}.tools{display:flex;gap:8px;align-items:center;background:#020304ee;border:1px solid var(--silver);border-radius:12px;padding:8px}.tools label{display:flex;gap:6px;align-items:center;color:var(--silver);font-size:12px}.hidden{display:none!important}#jsonFile{max-width:420px}.viewport{position:absolute;inset:0}.viewport.hidden{display:none}.inspector{border-left:1px solid var(--silver);overflow:auto;padding:16px}.inspector h2{margin:0 0 10px;font-size:16px}.kv{margin:0 0 14px}.kv dt{color:var(--silver);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-top:8px}.kv dd{margin:2px 0;word-break:break-word}.edgeRow{border-top:1px solid var(--silver);padding:7px 0}.error{padding:14px;border:2px solid var(--red);border-radius:12px}.error strong{color:var(--red)}pre{white-space:pre-wrap;word-break:break-word;border:1px solid var(--silver);padding:10px;border-radius:10px;font:11px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace}.status{padding:3px 8px;border-radius:999px;border:1px solid var(--silver);color:var(--silver);font-size:12px}.ok{color:var(--blue);border-color:var(--blue)}.bad{color:var(--red);border-color:var(--red)}
svg{width:100%;height:100%;display:block}svg text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.node{cursor:pointer}.node rect{fill:var(--black);stroke:var(--silver);stroke-width:2}.node:hover rect,.node.selected rect{stroke:var(--blue);stroke-width:3}.node .name{fill:var(--white);font-size:13px;font-weight:700}.node .type{fill:var(--silver);font-size:10px}.edge{fill:none;stroke-width:1.6;opacity:.78}.edge.containment{stroke:var(--silver)}.edge.relations{stroke:var(--blue)}.edge.ownership{stroke:var(--silver);stroke-dasharray:2 3}.edge.authority{stroke:var(--red)}.edge.dependencies{stroke:var(--blue);stroke-dasharray:6 4}.edgeLabel{fill:var(--silver);font-size:9px}
#space3d{perspective:900px;overflow:hidden;background:radial-gradient(circle at center,#06101d 0,#020304 62%)}#scene3d{position:absolute;inset:50% auto auto 50%;width:0;height:0;transform-style:preserve-3d;transition:transform .35s ease}.n3{position:absolute;width:160px;height:54px;margin:-27px 0 0 -80px;border:2px solid var(--silver);border-radius:12px;background:var(--black);padding:7px 9px;transform-style:preserve-3d;cursor:pointer;backface-visibility:hidden}.n3.selected,.n3:hover{border-color:var(--blue);box-shadow:0 0 14px #087cff55}.n3 b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.n3 small{color:var(--silver);font-size:9px}.line3{position:absolute;height:1px;background:var(--silver);transform-origin:0 0;opacity:.55}.hint{position:absolute;right:12px;bottom:12px;color:var(--silver);font-size:11px}
</style>
</head>
<body>
<header><strong>StructureProjector</strong><span class="status" id="status">idle</span><span class="meta" id="repo">AIGMos_docs</span><div class="spacer"></div><label>Branch <select id="branch"></select></label><button id="reload">Reload</button><span class="meta" id="revision"></span></header>
<nav id="nav"></nav>
<div class="shell">
  <section class="main">
    <div class="viewbar"><div class="views" id="views"></div><div class="tools"><label id="fileWrap" class="hidden">JSON <select id="jsonFile"></select></label><span id="dims"><label><input type="checkbox" data-dim="containment" checked>containment</label><label><input type="checkbox" data-dim="relations" checked>relations</label><label><input type="checkbox" data-dim="ownership" checked>ownership</label><label><input type="checkbox" data-dim="authority" checked>authority</label><label><input type="checkbox" data-dim="dependencies" checked>dependencies</label></span></div></div>
    <div class="viewport" id="view2d"><svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="viewport hidden" id="space3d"><div id="scene3d"></div><div class="hint">drag to rotate · wheel to zoom · click node to keep context</div></div>
  </section>
  <aside class="inspector" id="inspector"><h2>Inspector</h2><div class="meta">Select a node.</div></aside>
</div>
<script>
const state={cms:null,page:null,view:null,data:null,selected:null,visible:new Set(['containment','relations','ownership','authority','dependencies']),rotX:-18,rotY:28,zoom:1};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setStatus(t,b=false){$('#status').textContent=t;$('#status').className='status '+(b?'bad':'ok')}async function getJson(u){const r=await fetch(u),d=await r.json();if(!r.ok)throw d;return d}
async function init(){setStatus('nanoCMS');state.cms=await getJson('/api/nanocms');state.page=state.cms.default_page;renderNav();await resolvePage();const b=await getJson('/api/branches');$('#repo').textContent=b.repository;$('#branch').innerHTML=b.branches.map(x=>`<option>${esc(x.name)}</option>`).join('');if(b.branches.some(x=>x.name==='main'))$('#branch').value='main';await load()}
function renderNav(){$('#nav').innerHTML=state.cms.navigation.map(x=>`<button data-page="${esc(x.id)}" class="${x.id===state.page?'active':''}">${esc(x.menuitem)}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=async()=>{state.page=b.dataset.page;state.selected=null;$('#jsonFile').value='';renderNav();await resolvePage();await load()})}
async function resolvePage(){const p=await getJson('/api/nanocms?page='+encodeURIComponent(state.page));state.cms=p;const placements=p.selected_page.placements;state.view=placements[0].id;renderViews(placements)}
function renderViews(ps){$('#views').innerHTML=ps.map(p=>`<button data-view="${esc(p.id)}" class="${p.id===state.view?'active':''}">${esc(p.title)}</button>`).join('');$('#views').querySelectorAll('button').forEach(b=>b.onclick=async()=>{state.view=b.dataset.view;renderViews(ps);await load(true)})}
function url(){const q=new URLSearchParams({branch:$('#branch').value,page:state.page,view:state.view});if(state.page==='raw-json'&&$('#jsonFile').value)q.set('path',$('#jsonFile').value);return '/api/project?'+q}
async function load(preserveContext=false){setStatus('loading');const keep=preserveContext?state.selected:null;if(!preserveContext)state.selected=null;try{const d=await getJson(url());state.data=d;$('#revision').textContent=d.source.revision.slice(0,12);if(keep&&d.graph.nodes.some(n=>n.id===keep))state.selected=keep;if(d.ruleset==='RawJSON'){const fs=d.source.available_json_files||[],cur=d.source.path||'';$('#fileWrap').classList.remove('hidden');$('#dims').classList.add('hidden');$('#jsonFile').innerHTML=fs.map(p=>`<option value="${esc(p)}" ${p===cur?'selected':''}>${esc(p)}</option>`).join('')}else{$('#fileWrap').classList.add('hidden');$('#dims').classList.remove('hidden')}setStatus(`${d.page.title} · ${d.placement.title} · ${d.graph.nodes.length}`);renderCurrent();inspect(state.selected)}catch(e){showErrors(e.errors||[{id:'SP_UI',message:String(e)}]);setStatus('invalid',true)}}
function showErrors(es){$('#canvas').innerHTML='';$('#scene3d').innerHTML='';$('#inspector').innerHTML=`<h2>Preflight failed</h2><div class="error">${es.map(x=>`<p><strong>${esc(x.id)}</strong><br>${esc(x.message)}</p>`).join('')}</div>`}
function graphLayout(ns,es){const pa=new Map(),ch=new Map();ns.forEach(n=>ch.set(n.id,[]));es.filter(e=>e.dimension==='containment').forEach(e=>{pa.set(e.target,e.source);if(ch.has(e.source))ch.get(e.source).push(e.target)});const roots=ns.filter(n=>!pa.has(n.id)),lv=[],seen=new Set();function walk(ids,d){lv[d]??=[];for(const id of ids){if(seen.has(id))continue;seen.add(id);lv[d].push(id);walk(ch.get(id)||[],d+1)}}walk(roots.map(n=>n.id),0);ns.forEach(n=>{if(!seen.has(n.id)){lv[0]??=[];lv[0].push(n.id)}});return lv}
function renderCurrent(){const r=state.data?.placement?.renderer;$('#view2d').classList.toggle('hidden',r!=='svg');$('#space3d').classList.toggle('hidden',r!=='javascript_3d');r==='javascript_3d'?render3d():render2d()}
function render2d(){if(!state.data?.valid)return;const ns=state.data.graph.nodes,es=state.data.graph.edges,lv=graphLayout(ns,es),pos=new Map(),xg=220,yg=118;lv.forEach((ids,d)=>ids.forEach((id,i)=>pos.set(id,{x:70+i*xg,y:95+d*yg})));const w=Math.max(900,...lv.map(l=>l.length*xg+140)),h=Math.max(600,lv.length*yg+150),svg=$('#canvas');svg.setAttribute('viewBox',`0 0 ${w} ${h}`);let out='<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#AAB2C2"/></marker></defs>';for(const e of es){if(!state.visible.has(e.dimension))continue;const a=pos.get(e.source),b=pos.get(e.target);if(!a||!b)continue;const x1=a.x+85,y1=a.y+26,x2=b.x+85,y2=b.y+26,m=(x1+x2)/2;out+=`<path class="edge ${e.dimension}" marker-end="url(#a)" d="M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}"/>`}for(const n of ns){const p=pos.get(n.id);out+=`<g class="node ${state.selected===n.id?'selected':''}" data-id="${esc(n.id)}" transform="translate(${p.x},${p.y})"><rect width="170" height="52" rx="12"/><text class="name" x="9" y="20">${esc((n.name||n.id).slice(0,24))}</text><text class="type" x="9" y="39">${esc((n.type||n.kind||'').slice(0,27))}</text></g>`}svg.innerHTML=out;svg.querySelectorAll('.node').forEach(n=>n.onclick=()=>selectNode(n.dataset.id))}
function render3d(){if(!state.data?.valid)return;const ns=state.data.graph.nodes,es=state.data.graph.edges,lv=graphLayout(ns,es),pos=new Map();lv.forEach((ids,d)=>{const radius=Math.max(170,ids.length*42);ids.forEach((id,i)=>{const a=(Math.PI*2*i/Math.max(1,ids.length))+(d%2*.35);pos.set(id,{x:Math.cos(a)*radius,y:(d-lv.length/2)*120,z:Math.sin(a)*radius})})});const scene=$('#scene3d');let out='';for(const e of es.filter(e=>state.visible.has(e.dimension))){const a=pos.get(e.source),b=pos.get(e.target);if(!a||!b)continue;const dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z,len=Math.hypot(dx,dy,dz),yaw=Math.atan2(dz,dx)*180/Math.PI,pitch=-Math.atan2(dy,Math.hypot(dx,dz))*180/Math.PI;out+=`<div class="line3" style="width:${len}px;transform:translate3d(${a.x}px,${a.y}px,${a.z}px) rotateY(${-yaw}deg) rotateZ(${pitch}deg)"></div>`}for(const n of ns){const p=pos.get(n.id);out+=`<div class="n3 ${state.selected===n.id?'selected':''}" data-id="${esc(n.id)}" style="transform:translate3d(${p.x}px,${p.y}px,${p.z}px)"><b>${esc((n.name||n.id).slice(0,25))}</b><small>${esc((n.type||n.kind||'').slice(0,30))}</small></div>`}scene.innerHTML=out;apply3d();scene.querySelectorAll('.n3').forEach(n=>n.onclick=()=>selectNode(n.dataset.id))}
function apply3d(){$('#scene3d').style.transform=`scale(${state.zoom}) rotateX(${state.rotX}deg) rotateY(${state.rotY}deg)`}function selectNode(id){state.selected=id;renderCurrent();inspect(id)}
function inspect(id){const b=$('#inspector');if(!id||!state.data?.valid){b.innerHTML='<h2>Inspector</h2><div class="meta">Select a node.</div>';return}const n=state.data.graph.nodes.find(x=>x.id===id),inc=state.data.graph.edges.filter(e=>e.target===id),out=state.data.graph.edges.filter(e=>e.source===id);b.innerHTML=`<h2>${esc(n.name)}</h2><dl class="kv"><dt>Identity / context</dt><dd>${esc(n.id)}</dd><dt>Type</dt><dd>${esc(n.type)}</dd>${n.pointer?`<dt>JSON Pointer</dt><dd>${esc(n.pointer)}</dd>`:''}<dt>Source</dt><dd>${esc(n.source)}</dd></dl><h2>Incoming</h2>${rows(inc)}<h2>Outgoing</h2>${rows(out)}<h2>Raw</h2><pre>${esc(JSON.stringify(n.raw,null,2))}</pre>`}function rows(es){return es.length?es.map(e=>`<div class="edgeRow"><b>${esc(e.dimension)}</b> · ${esc(e.type)}<br><span class="meta">${esc(e.source)} → ${esc(e.target)}</span></div>`).join(''):'<div class="meta">none</div>'}
$('#reload').onclick=()=>load();$('#branch').onchange=()=>load();$('#jsonFile').onchange=()=>load();document.querySelectorAll('[data-dim]').forEach(c=>c.onchange=()=>{c.checked?state.visible.add(c.dataset.dim):state.visible.delete(c.dataset.dim);renderCurrent()});let drag=false,lx=0,ly=0;$('#space3d').onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;$('#space3d').setPointerCapture(e.pointerId)};$('#space3d').onpointermove=e=>{if(!drag)return;state.rotY+=(e.clientX-lx)*.35;state.rotX-=(e.clientY-ly)*.35;lx=e.clientX;ly=e.clientY;apply3d()};$('#space3d').onpointerup=()=>drag=false;$('#space3d').onwheel=e=>{e.preventDefault();state.zoom=Math.max(.25,Math.min(2.5,state.zoom*(e.deltaY>0?.9:1.1)));apply3d()};init().catch(e=>showErrors([{id:'SP_UI',message:String(e)}]));
</script>
</body>
</html>
