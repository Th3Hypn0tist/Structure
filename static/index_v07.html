<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StructureProjector</title>
<style>
:root{--b:#020304;--w:#F8FAFF;--bl:#087CFF;--r:#FF176B;--s:#AAB2C2;--g:#FFD83D}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--w);font:14px/1.4 Inter,"Segoe UI",Arial,sans-serif;height:100vh;overflow:hidden}header{height:62px;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2px solid var(--bl)}header strong{font-size:18px}.muted{color:var(--s);font-size:12px}.spacer{flex:1}button,select{background:var(--b);color:var(--w);border:1px solid var(--s);border-radius:10px;padding:8px 10px}button{cursor:pointer}nav{height:48px;display:flex;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--s)}nav button.active,.views button.active{border:2px solid var(--bl);color:var(--bl)}.shell{height:calc(100vh - 110px);display:grid;grid-template-columns:minmax(0,1fr) 380px}.main{position:relative;overflow:hidden}.bar{position:absolute;z-index:10;left:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap}.views,.tools{display:flex;gap:6px;align-items:center;background:#020304ee;border:1px solid var(--s);border-radius:12px;padding:8px}.viewport{position:absolute;inset:0;overflow:hidden}.hidden{display:none!important}.inspector{border-left:1px solid var(--s);padding:16px;overflow:auto}.status{border:1px solid var(--s);border-radius:999px;padding:3px 8px;font-size:12px;color:var(--s)}.ok{color:var(--bl);border-color:var(--bl)}.bad{color:var(--r);border-color:var(--r)}pre{white-space:pre-wrap;word-break:break-word;border:1px solid var(--s);border-radius:10px;padding:10px;font:11px/1.4 ui-monospace,monospace}.error{border:2px solid var(--r);border-radius:12px;padding:12px}.error strong{color:var(--r)}svg{width:100%;height:100%;display:block;user-select:none}.node{cursor:pointer}.node rect{fill:var(--b);stroke:var(--s);stroke-width:2}.node.selected rect,.node:hover rect{stroke:var(--bl);stroke-width:3}.node text{pointer-events:none}.name{fill:var(--w);font-size:13px;font-weight:800}.type{fill:var(--s);font-size:10px}.edge{fill:none;stroke:var(--s);stroke-width:1.5;opacity:.7}.frame{fill:var(--b);stroke:var(--bl);stroke-width:2.5}.frame.authority{stroke:var(--r)}.block{fill:var(--b);stroke:var(--s);stroke-width:1.5}.card{fill:var(--b);stroke:var(--s);stroke-width:1.5}.chip{fill:var(--b);stroke:var(--s);stroke-width:1.1}.title{fill:var(--w);font-size:22px;font-weight:900}.subtitle{fill:var(--s);font-size:11px}.blocktitle{fill:var(--bl);font-size:13px;font-weight:900}.itemtitle{fill:var(--w);font-size:12px;font-weight:800}.itemsummary{fill:var(--s);font-size:9px}.chiptext{fill:var(--w);font-size:10px;font-weight:800}#space3d{perspective:900px}#scene3d{position:absolute;left:50%;top:50%;transform-style:preserve-3d}.n3{position:absolute;width:160px;height:54px;margin:-27px 0 0 -80px;border:2px solid var(--s);border-radius:12px;background:var(--b);padding:7px 9px;cursor:pointer}.n3.selected,.n3:hover{border-color:var(--bl)}.n3 small{color:var(--s)}.zoomread{min-width:46px;color:var(--s);font-size:11px;text-align:right}
</style></head><body>
<header><strong>StructureProjector</strong><span id="status" class="status">idle</span><span id="repo" class="muted"></span><div class="spacer"></div><label>Branch <select id="branch"></select></label><button id="reload">Reload</button><span id="rev" class="muted"></span></header>
<nav id="nav"></nav>
<div class="shell"><section class="main"><div class="bar"><div class="views" id="views"></div><div class="tools"><label id="fileWrap" class="hidden">JSON <select id="jsonFile"></select></label><span id="dims"><label><input type="checkbox" data-dim="containment" checked>containment</label> <label><input type="checkbox" data-dim="relations" checked>relations</label> <label><input type="checkbox" data-dim="ownership" checked>ownership</label> <label><input type="checkbox" data-dim="authority" checked>authority</label> <label><input type="checkbox" data-dim="dependencies" checked>dependencies</label></span><button id="fit">Fit</button><span id="zoomread" class="zoomread">100%</span></div></div><div id="svgView" class="viewport"><svg id="canvas"><g id="world"></g></svg></div><div id="space3d" class="viewport hidden"><div id="scene3d"></div></div></section><aside id="inspector" class="inspector"><h2>Inspector</h2><div class="muted">Select an item.</div></aside></div>
<script>
const S={cms:null,page:null,view:null,data:null,selected:null,selectedItem:null,visible:new Set(['containment','relations','ownership','authority','dependencies']),cameras:new Map(),rx:-18,ry:28,z3:1};const $=q=>document.querySelector(q);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function gj(u){const r=await fetch(u),d=await r.json();if(!r.ok)throw d;return d}function st(t,b=false){$('#status').textContent=t;$('#status').className='status '+(b?'bad':'ok')}
function cam(){if(!S.cameras.has(S.view))S.cameras.set(S.view,{x:0,y:0,z:1,baseW:1000,baseH:700});return S.cameras.get(S.view)}function applyCam(){const c=cam(),svg=$('#canvas');svg.setAttribute('viewBox',`${c.x} ${c.y} ${c.baseW/c.z} ${c.baseH/c.z}`);$('#zoomread').textContent=Math.round(c.z*100)+'%'}function fitCamera(w,h){const rect=$('#svgView').getBoundingClientRect(),scale=Math.min(rect.width/w,rect.height/h)*.94,c=cam();c.baseW=rect.width;c.baseH=rect.height;c.z=Math.max(.03,scale);c.x=(w-rect.width/c.z)/2;c.y=(h-rect.height/c.z)/2;applyCam()}
function wheelZoom(e){if($('#svgView').classList.contains('hidden'))return;e.preventDefault();const svg=$('#canvas'),c=cam(),r=svg.getBoundingClientRect();c.baseW=r.width;c.baseH=r.height;const bw=r.width/c.z,bh=r.height/c.z,mx=(e.clientX-r.left)/r.width,my=(e.clientY-r.top)/r.height,wx=c.x+mx*bw,wy=c.y+my*bh,next=Math.min(30,Math.max(.02,c.z*Math.exp(-e.deltaY*.0015))),aw=r.width/next,ah=r.height/next;c.z=next;c.x=wx-mx*aw;c.y=wy-my*ah;applyCam()}
let drag=null;function panStart(e){if(e.button!==0||e.target.closest('.node'))return;const c=cam();drag={sx:e.clientX,sy:e.clientY,x:c.x,y:c.y};$('#svgView').setPointerCapture?.(e.pointerId)}function panMove(e){if(!drag)return;const c=cam(),r=$('#canvas').getBoundingClientRect();c.x=drag.x-(e.clientX-drag.sx)/c.z;c.y=drag.y-(e.clientY-drag.sy)/c.z;applyCam()}function panEnd(){drag=null}
async function init(){S.cms=await gj('/api/nanocms');S.page=S.cms.default_page;nav();await resolvePage();const b=await gj('/api/branches');$('#repo').textContent=b.repository;$('#branch').innerHTML=b.branches.map(x=>`<option>${esc(x.name)}</option>`).join('');if(b.branches.some(x=>x.name==='main'))$('#branch').value='main';await load()}
function nav(){$('#nav').innerHTML=S.cms.navigation.map(x=>`<button data-page="${x.id}" class="${x.id===S.page?'active':''}">${esc(x.menuitem)}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=async()=>{S.page=b.dataset.page;S.selected=null;S.selectedItem=null;nav();await resolvePage();await load()})}
async function resolvePage(){const p=await gj('/api/nanocms?page='+encodeURIComponent(S.page));S.cms=p;S.view=p.selected_page.placements[0].id;views(p.selected_page.placements)}function views(ps){$('#views').innerHTML=ps.map(p=>`<button data-view="${p.id}" class="${p.id===S.view?'active':''}">${esc(p.title)}</button>`).join('');$('#views').querySelectorAll('button').forEach(b=>b.onclick=async()=>{S.view=b.dataset.view;views(ps);await load(true)})}
function url(){const q=new URLSearchParams({branch:$('#branch').value,page:S.page,view:S.view});if(S.page==='raw-json'&&$('#jsonFile').value)q.set('path',$('#jsonFile').value);if(S.selected)q.set('context',S.selected);return'/api/project?'+q}async function load(keep=false){const sel=keep?S.selected:null;st('loading');try{const d=await gj(url());S.data=d;$('#rev').textContent=d.source.revision.slice(0,12);if(sel&&d.graph?.nodes?.some(n=>n.id===sel))S.selected=sel;else if(!keep)S.selected=null;if(d.ruleset==='RawJSON'){const fs=d.source.available_json_files||[];$('#fileWrap').classList.remove('hidden');$('#jsonFile').innerHTML=fs.map(p=>`<option value="${esc(p)}" ${p===d.source.path?'selected':''}>${esc(p)}</option>`).join('')}else $('#fileWrap').classList.add('hidden');$('#dims').classList.toggle('hidden',d.ruleset==='ExplicitJSONView');const count=d.graph?.nodes?.length||d.projection?.occurrences?.length||0;st(`${d.page.title} · ${d.placement.title} · ${count}`);render();inspect()}catch(e){showErr(e.errors||[{id:'SP_UI',message:String(e)}]);st('invalid',true)}}
function showErr(es){$('#world').innerHTML='';$('#scene3d').innerHTML='';$('#inspector').innerHTML=`<h2>Preflight failed</h2><div class="error">${es.map(e=>`<p><strong>${esc(e.id)}</strong><br>${esc(e.message)}</p>`).join('')}</div>`}
function levels(ns,es){const ch=new Map(ns.map(n=>[n.id,[]])),par=new Set();es.filter(e=>e.dimension==='containment').forEach(e=>{if(ch.has(e.source))ch.get(e.source).push(e.target);par.add(e.target)});const lv=[],seen=new Set();function w(ids,d){lv[d]??=[];ids.forEach(id=>{if(seen.has(id))return;seen.add(id);lv[d].push(id);w(ch.get(id)||[],d+1)})}w(ns.filter(n=>!par.has(n.id)).map(n=>n.id),0);ns.forEach(n=>{if(!seen.has(n.id)){lv[0]??=[];lv[0].push(n.id)}});return lv}
function render(){const r=S.data?.placement?.renderer;$('#svgView').classList.toggle('hidden',r==='javascript_3d');$('#space3d').classList.toggle('hidden',r!=='javascript_3d');if(r==='javascript_3d')r3();else if(r==='svg_view_rules')rexplicit();else if(r==='svg_master_map')rmap();else rtree()}
function rexplicit(){const p=S.data.projection,v=S.data.view_projection;if(!p)return showErr([{id:'SP_VIEW_PROJECTION',message:'Explicit view geometry missing.'}]);let o=`<defs><pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#AAB2C2" stroke-opacity=".055"/></pattern></defs><rect width="${p.view_box.width}" height="${p.view_box.height}" fill="url(#grid)"/><text class="title" x="44" y="42">${esc(v.title)}</text><text class="blocktitle" x="44" y="67">${esc(v.subtitle)}</text>`;for(const x of p.occurrences){if(x.kind==='section'){o+=`<g><rect class="frame ${x.accent==='authority'?'authority':''}" x="${x.x}" y="${x.y}" width="${x.width}" height="${x.height}" rx="20"/><text class="title" x="${x.x+20}" y="${x.y+34}">${esc(x.title)}</text><text class="subtitle" x="${x.x+20}" y="${x.y+53}">${esc(x.subtitle||'')}</text></g>`}else if(x.kind==='block'){o+=`<g><rect class="block" x="${x.x}" y="${x.y}" width="${x.width}" height="${x.height}" rx="14"/><text class="blocktitle" x="${x.x+14}" y="${x.y+27}">${esc(x.title)}</text></g>`}else{o+=`<g class="node" data-item="${esc(x.id)}"><rect class="${x.role==='chip'?'chip':'card'}" x="${x.x}" y="${x.y}" width="${x.width}" height="${x.height}" rx="${x.role==='chip'?9:12}"/><text class="${x.role==='chip'?'chiptext':'itemtitle'}" x="${x.x+10}" y="${x.y+(x.role==='chip'?21:24)}">${esc((x.title||'').slice(0,52))}</text>${x.role!=='chip'?`<text class="itemsummary" x="${x.x+10}" y="${x.y+43}">${esc((x.summary||'').slice(0,130))}</text>`:''}</g>`}}$('#world').innerHTML=o;$('#world').querySelectorAll('[data-item]').forEach(el=>el.onclick=()=>{S.selectedItem=p.occurrences.find(x=>x.id===el.dataset.item);inspect()});if(!S.cameras.has(S.view))fitCamera(p.view_box.width,p.view_box.height);else applyCam()}
function rtree(){const ns=S.data.graph.nodes,es=S.data.graph.edges,lv=levels(ns,es),pos=new Map(),xg=220,yg=118;lv.forEach((ids,d)=>ids.forEach((id,i)=>pos.set(id,{x:70+i*xg,y:95+d*yg})));const w=Math.max(900,...lv.map(x=>x.length*xg+140)),h=Math.max(600,lv.length*yg+150);let o='';es.filter(e=>S.visible.has(e.dimension)).forEach(e=>{const a=pos.get(e.source),b=pos.get(e.target);if(a&&b)o+=`<path class="edge" d="M${a.x+85},${a.y+26} L${b.x+85},${b.y+26}"/>`});ns.forEach(n=>{const p=pos.get(n.id);o+=`<g class="node ${S.selected===n.id?'selected':''}" data-id="${esc(n.id)}" transform="translate(${p.x},${p.y})"><rect width="170" height="52" rx="12"/><text class="name" x="9" y="20">${esc((n.name||n.id).slice(0,24))}</text><text class="type" x="9" y="39">${esc((n.type||n.kind||'').slice(0,27))}</text></g>`});$('#world').innerHTML=o;bindNodes();if(!S.cameras.has(S.view))fitCamera(w,h);else applyCam()}
function rmap(){const p=S.data.projection;if(!p)return showErr([{id:'SP_MAP_PROJECTION',message:'Map projection missing.'}]);let o='';for(const x of p.occurrences){const cls=x.role==='frame'?'frame':x.role==='section'?'block':x.role==='card'?'card':'chip';o+=`<g class="node ${S.selected===x.id?'selected':''}" data-id="${esc(x.id)}"><rect class="${cls}" x="${x.x}" y="${x.y}" width="${x.width}" height="${x.height}" rx="12"/><text class="itemtitle" x="${x.x+10}" y="${x.y+24}">${esc((x.title||'').slice(0,50))}</text></g>`}$('#world').innerHTML=o;bindNodes();if(!S.cameras.has(S.view))fitCamera(p.view_box.width,p.view_box.height);else applyCam()}
function bindNodes(){$('#world').querySelectorAll('[data-id]').forEach(n=>n.onclick=()=>{S.selected=n.dataset.id;S.selectedItem=null;render();inspect()})}
function r3(){const ns=S.data.graph.nodes,lv=levels(ns,S.data.graph.edges),pos=new Map();lv.forEach((ids,d)=>{const rad=Math.max(170,ids.length*42);ids.forEach((id,i)=>{const a=2*Math.PI*i/Math.max(1,ids.length);pos.set(id,{x:Math.cos(a)*rad,y:(d-lv.length/2)*120,z:Math.sin(a)*rad})})});$('#scene3d').innerHTML=ns.map(n=>{const p=pos.get(n.id);return`<div class="n3 ${S.selected===n.id?'selected':''}" data-id="${esc(n.id)}" style="transform:translate3d(${p.x}px,${p.y}px,${p.z}px)"><b>${esc((n.name||n.id).slice(0,24))}</b><small>${esc((n.type||'').slice(0,28))}</small></div>`}).join('');$('#scene3d').style.transform=`scale(${S.z3}) rotateX(${S.rx}deg) rotateY(${S.ry}deg)`;$('#scene3d').querySelectorAll('[data-id]').forEach(n=>n.onclick=()=>{S.selected=n.dataset.id;inspect()})}
function inspect(){const b=$('#inspector');if(S.selectedItem){const x=S.selectedItem;b.innerHTML=`<h2>${esc(x.title)}</h2><p>${esc(x.summary||'')}</p><h3>Provenance</h3><pre>${esc(JSON.stringify(x.provenance,null,2))}</pre>${x.value!==null&&x.value!==undefined?`<h3>Value</h3><pre>${esc(JSON.stringify(x.value,null,2))}</pre>`:''}`;return}if(!S.selected||!S.data?.graph?.nodes){b.innerHTML='<h2>Inspector</h2><div class="muted">Select an item.</div>';return}const n=S.data.graph.nodes.find(n=>n.id===S.selected);if(!n)return;b.innerHTML=`<h2>${esc(n.name)}</h2><p class="muted">${esc(n.id)}</p><p><b>Type:</b> ${esc(n.type)}</p>${n.pointer?`<p><b>Pointer:</b> ${esc(n.pointer)}</p>`:''}<p><b>Source:</b> ${esc(n.source)}</p><pre>${esc(JSON.stringify(n.raw,null,2))}</pre>`}
$('#reload').onclick=()=>load();$('#branch').onchange=()=>{S.cameras.clear();load()};$('#jsonFile').onchange=()=>{S.selected=null;S.cameras.delete(S.view);load()};$('#fit').onclick=()=>S.cameras.delete(S.view)||render();document.querySelectorAll('[data-dim]').forEach(cb=>cb.onchange=()=>{cb.checked?S.visible.add(cb.dataset.dim):S.visible.delete(cb.dataset.dim);render()});$('#svgView').addEventListener('wheel',wheelZoom,{passive:false});$('#svgView').addEventListener('pointerdown',panStart);$('#svgView').addEventListener('pointermove',panMove);$('#svgView').addEventListener('pointerup',panEnd);$('#svgView').addEventListener('pointercancel',panEnd);init().catch(e=>showErr(e.errors||[{id:'SP_INIT',message:String(e)}]));
</script></body></html>
